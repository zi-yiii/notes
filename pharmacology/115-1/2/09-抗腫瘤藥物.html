 if(!['folate','nucleotides','purine'].includes(t.id))return null;
 let s='<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718b9b"/></marker></defs>';
 const n=(x,y,en,cn,dim=false,cls='')=>s+=`<g class="${dim?'dim':''}"><text class="${cls}" x="${x}" y="${y}" text-anchor="middle">${esc(en)}</text>`+(zh&&cn?`<text class="cn ${cls}" x="${x}" y="${y+23}" text-anchor="middle">${esc(cn)}</text>`:'')+'</g>';
 const l=(p,dim=false)=>s+=`<path class="${dim?'dim':''}" d="${p}" fill="none" stroke="#718b9b" stroke-width="2" marker-end="url(#arr)"/>`;
 const badge=(cx,cy,name,cn,w=330)=>{s+=`<rect x="${cx-w/2}" y="${cy}" width="${w}" height="${zh?68:48}" rx="6" fill="#e0e9ec"/>`;n(cx,cy+29,name,cn,false,'drug')};
 const inhibit=(p,x,y)=>s+=`<path d="${p}" fill="none" stroke="#b35064" stroke-width="2.3"/><path d="M${x-9} ${y}h18" stroke="#b35064" stroke-width="2.3"/>`;
 if(t.id==='folate'){
  let m=!!a&&a.target===0,f=!!a&&a.target===1,down=m||f;
  // Four shared columns; substrate, enzyme and product labels use fixed baselines.
  n(200,210,'DHF','二氫葉酸');n(400,210,'DHFR','二氫葉酸還原酶',false,'enzyme');n(600,210,'THF','四氫葉酸',m);n(800,210,'5,10-methylene-THF','5,10-亞甲基四氫葉酸',m);
  n(800,262,'One-carbon donor','一碳供體',m,'enzyme');l('M240 205H355',m);l('M445 205H560',m);l('M640 205H690',m);
  n(200,360,'dUMP','去氧尿苷酸');n(400,360,'Thymidylate synthase','胸苷酸合成酶',false,'enzyme');n(600,360,'dTMP','胸苷酸',down);n(800,360,'DNA','DNA',down);
  l('M245 355H300',down);l('M500 355H555',down);l('M645 355H760',down);
  l('M800 302V315H400V330',down);
  n(200,480,'DHF','再生的二氫葉酸',down);l('M330 400V475H245',down);l('M155 475H85V205H155',down);
  if(m){badge(400,55,a.name,a.zh);inhibit(`M400 ${zh?133:113}V180`,400,180)}
  if(f){badge(650,455,a.name,a.zh);inhibit('M650 445V415H400V400',400,400)}
 }else if(t.id==='nucleotides'){
  let rr=!!a&&a.target===0,pol=!!a&&a.target===1;
  n(170,235,'Ribonucleotides','核糖核苷酸');n(500,235,'Ribonucleotide reductase','核糖核苷酸還原酶',false,'enzyme');n(830,235,'Deoxyribonucleotides','去氧核苷酸',rr);l('M250 230H350',rr);l('M650 230H710',rr);
  n(500,395,'DNA polymerase','DNA 聚合酶',false,'enzyme');n(170,395,'DNA elongation','DNA 鏈延長',rr||pol);l('M830 280V390H605',rr||pol);l('M395 390H255',rr||pol);
  if(rr){badge(500,55,a.name,a.zh,380);inhibit(`M500 ${zh?133:113}V205`,500,205)}
  if(pol){badge(500,465,a.name,a.zh,380);inhibit('M500 455V435',500,435)}
 }else{
  n(170,325,'Purine precursors','嘌呤前驅物');n(500,325,'Purine synthesis','嘌呤合成',!!a&&a.name==='Thiopurines');n(830,325,'DNA synthesis','DNA 合成',!!a);l('M255 320H370',!!a&&a.name==='Thiopurines');l('M635 320H750',!!a);
  if(a&&a.name==='Thiopurines'){
   n(145,135,'6-MP (activation example)','以 6-MP 活化為例');n(435,135,'HGPRT','次黃嘌呤鳥嘌呤磷酸核糖轉移酶',false,'enzyme');n(800,135,'TIMP / active metabolites','TIMP／後續活性代謝物');l('M270 130H385');l('M490 130H650');
   badge(500,445,a.name,a.zh);inhibit('M500 435V365',500,365);n(460,220,'Disrupt purine metabolism','干擾嘌呤代謝',false,'enzyme');inhibit('M800 175V265H500V285',500,285);
  }else if(a){
   n(260,145,'Fludarabine / cladribine','Fludarabine／Cladribine');n(760,145,'Active nucleotides','活性核苷酸');l('M405 140H650');n(505,195,'Cellular phosphorylation','細胞內磷酸化',false,'enzyme');
   badge(830,445,a.name,a.zh);inhibit('M830 435V365',830,365);inhibit('M760 185V245H830V285',830,285);
  }
 }
 return s;
}

function drawCytotoxic(t,a,zh){
 if(!['dna','topo','microtubules'].includes(t.id))return null;
 let s='<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718b9b"/></marker></defs>';
 const txt=(x,y,en,cn,cls='')=>{s+=`<text class="${cls}" x="${x}" y="${y}" text-anchor="middle">${esc(en)}</text>`;if(zh&&cn)s+=`<text class="cn ${cls}" x="${x}" y="${y+23}" text-anchor="middle">${esc(cn)}</text>`};
 const path=(d,dim=false)=>s+=`<path d="${d}" fill="none" stroke="#718b9b" stroke-width="2" marker-end="url(#arr)" ${dim?'opacity=".3"':''}/>`;
 const drug=(x,y,tx,ty,promote=false)=>{if(!a)return;let col=promote?'#4d8674':'#b35064',height=zh?64:43;s+=`<rect x="${x-175}" y="${y}" width="350" height="${height}" rx="6" fill="#e0e9ec"/>`;txt(x,y+26,a.name,a.zh,'drug');let from=ty>y?y+height+9:y-9,end=ty+(ty>y?-10:10);s+=`<path d="M${x} ${from}V${end}" stroke="${col}" stroke-width="2.3" fill="none"/>`;s+=promote?`<path d="M${tx-6} ${end+(ty>y?-8:8)}L${tx} ${end}L${tx+6} ${end+(ty>y?-8:8)}" fill="none" stroke="${col}" stroke-width="2.3"/>`:`<path d="M${tx-9} ${end}h18" stroke="${col}" stroke-width="2.3"/>`;};
 if(t.id==='microtubules'){
  txt(180,270,'Tubulin dimers','微管蛋白二聚體');txt(820,270,'Microtubules','微管');path('M285 265H310V200H710V265H735',a&&a.target===0);path('M820 305V370H180V305',a&&a.target===1);txt(650,168,'Polymerization','聚合','enzyme');txt(755,405,'Depolymerization','解聚','enzyme');
  if(a&&a.target===1)drug(500,420,500,370);else if(a)drug(500,48,500,200);
  txt(500,523,a?'Dynamic instability disrupted → metaphase arrest':'Dynamic microtubules → spindle function → mitosis',a?'微管動態受干擾 → 中期停滯':'微管動態 → 紡錘體功能 → 有絲分裂','enzyme');
 }else if(t.id==='topo'){
  const one=a&&a.name==='Topoisomerase I inhibitors',anth=a&&a.name==='Anthracyclines';
  txt(155,260,'DNA torsional stress','DNA 扭轉張力');txt(490,260,a?(one?'Single-strand cleavage':'Double-strand cleavage'):'Transient DNA cleavage',a?(one?'暫時切斷單股 DNA':'暫時切斷雙股 DNA'):'暫時切斷 DNA');s+=`<g opacity="${a?.36:1}">`;txt(840,260,'Religated DNA','重新接合的 DNA');s+='</g>';path('M270 255H365');path('M620 255H745',!!a);txt(320,320,a?(one?'Topoisomerase I':'Topoisomerase II'):'Topoisomerase','拓撲酶','enzyme');txt(685,320,'Religation','重新接合','enzyme');if(a){drug(685,50,685,255);txt(510,400,'Trapped cleavage complex → DNA breaks persist','切割複合體被困住 → DNA 斷裂持續','enzyme');}if(anth){txt(180,480,'ROS generation','活性氧產生','enzyme');path('M280 475H425');txt(585,480,'Oxidative DNA damage','氧化性 DNA 傷害','enzyme');}
 }else if(!a){txt(155,265,'Intact DNA','完整 DNA');txt(490,265,'DNA replication','DNA 複製');txt(835,265,'Daughter DNA','新生 DNA');path('M245 260H380');path('M610 260H745');
 }else if(a.name==='Nitrogen mustards'){
  txt(235,180,'Cyclophosphamide / ifosfamide','環磷醯胺／異環磷醯胺');txt(235,120,'Prodrug subgroup only','僅此前驅藥分支','enzyme');path('M235 220V270');txt(235,310,'Activated metabolites','活性代謝物');txt(365,258,'Hepatic CYP','肝臟 CYP','enzyme');path('M345 305H590');txt(795,310,'DNA alkylation / cross-links','DNA 烷化／交聯');txt(735,140,'Chlorambucil / melphalan','其他直接作用氮芥藥');path('M735 180V265');path('M235 350V410H325');txt(515,415,'Acrolein → bladder injury','丙烯醛 → 膀胱傷害','enzyme');drug(795,445,795,350,true);
 }else{
 const bleo=a.name==='DNA-breaking antibiotics';txt(160,270,bleo?'Oxidative stress':'DNA before injury',bleo?'氧化壓力':'受損前 DNA');txt(500,270,bleo?'DNA strand breaks':'DNA adducts / lesions',bleo?'DNA 股斷裂':'DNA 加合物／損傷');txt(840,270,'Replication failure','複製失敗');path('M270 265H385');path('M620 265H745',true);txt(330,325,bleo?'ROS-mediated damage':a.name==='Platinum compounds'?'DNA cross-link formation':'DNA alkylation',bleo?'ROS 介導傷害':a.name==='Platinum compounds'?'DNA 交聯形成':'DNA 烷化', 'enzyme');drug(330,55,330,265,true);
 }
 return s;
}

function drawTargeted(t,a,zh){
 if(!['kinases','angiogenesis','immunity'].includes(t.id))return null;
 const e=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let s='<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718b9b"/></marker></defs>';
 const txt=(x,y,en,cn='',dim=false,weight=400)=>{s+=`<g opacity="${dim?.35:1}"><text x="${x}" y="${y}" text-anchor="middle" style="font-size:${weight===600?17:20}px;font-weight:${weight};fill:${weight===600?'#314f63':'#293742'}">${e(en)}</text>`+(zh&&cn?`<text x="${x}" y="${y+23}" text-anchor="middle" style="font-size:15px;fill:#657783">${e(cn)}</text>`:'')+'</g>'};
 const line=(d,dim=false,arrow=true)=>s+=`<path d="${d}" fill="none" stroke="#718b9b" stroke-width="2" marker-end="${arrow?'url(#arr)':'none'}" opacity="${dim?.3:1}"/>`;
 const tag=(x,y,targetY,kind='inhibit',targetX=x)=>{let w=Math.min(390,Math.max(260,a.name.length*9));let h=zh?66:44;s+=`<rect x="${x-w/2}" y="${y}" width="${w}" height="${h}" rx="6" fill="#e0e9ec"/>`;txt(x,y+28,a.name,a.zh,false,600);let below=y>targetY,from=below?y-9:y+h+9,end=targetY,col=kind==='promote'?'#4d8674':'#b35064';s+=`<path d="${targetX===x?`M${x} ${from}V${end}`:`M${x-w/2-10} ${y+30}H${targetX}V${end}`}" fill="none" stroke="${col}" stroke-width="2.3"/>`;s+=kind==='promote'?`<path d="M${x-6} ${end+(below?8:-8)}L${x} ${end}L${x+6} ${end+(below?8:-8)}" fill="none" stroke="${col}" stroke-width="2.3"/>`:`<path d="M${targetX-9} ${end}h18" stroke="${col}" stroke-width="2.3"/>`};
 if(t.id==='kinases'){
  if(a&&a.name==='BCR–ABL / KIT TKIs'){
   txt(330,245,'BCR–ABL fusion kinase','BCR–ABL 融合激酶');txt(330,355,'KIT receptor kinase','Imatinib 例：KIT 受體激酶');txt(800,300,'Growth / survival','增生與存活',true);line('M495 240H620V295H690',true);line('M465 350H620V295',true,false);tag(330,55,211);s+='<path d="M200 78H90V350H210" fill="none" stroke="#b35064" stroke-width="2.3"/><path d="M210 341V359" stroke="#b35064" stroke-width="2.3"/>';
  }else{
   let her=a&&a.name.startsWith('HER2'),anti=a&&a.target===0;
   txt(170,210,her?'HER2 activation':'EGF',her?'HER2 活化':'表皮生長因子');txt(505,210,her?'HER2 extracellular domain':'EGFR extracellular domain','受體細胞外部分');line('M275 205H360',!!anti);
   s+='<path d="M65 282H935" stroke="#c8d3d8" stroke-width="2" stroke-dasharray="5 5"/>';txt(830,247,'Cell membrane','細胞膜');
   txt(505,365,her?'HER2 kinase':'EGFR kinase','受體細胞內激酶',!!anti);line('M505 245V325',!!a);txt(840,365,'Growth / survival','增生與存活',!!a);line('M600 360H725',!!a);
   if(a)tag(505,anti?55:455,anti?177:(zh?402:381));
  }
 }else if(t.id==='angiogenesis'){
  let ligand=a&&a.target===0;txt(180,215,'VEGF','血管內皮生長因子');txt(565,215,'Endothelial VEGFR','內皮細胞 VEGFR',!!ligand);line('M240 210H430',!!ligand);txt(565,365,'VEGFR kinase','VEGFR 激酶',!!ligand);line('M565 255V325',!!a);txt(850,365,'Angiogenesis','血管新生',!!a);line('M670 360H755',!!a);if(a)tag(ligand?180:565,ligand?55:455,ligand?181:(zh?402:381));
 }else{
  const name=a?a.name:'',pd=name==='PD-1 blockers',pl=name==='PD-L1 blockers',ct=name==='CTLA-4 blockers',cd=name==='Anti-CD20 antibodies';
  // Shared columns and connection ports: 190 / 510 / 830. Distinct clearance section.
  s+='<text x="60" y="20" style="font-size:15px;fill:#627482">Checkpoint signaling</text>';
  txt(190,155,'PD-L1','PD-L1 配體');txt(190,245,'PD-L2','PD-L2 配體');txt(510,200,'PD-1','T 細胞上的 PD-1');txt(830,200,'T-cell inhibition','T 細胞活性受抑制',pd);
  line('M250 150H350V195',pd||pl,false);line('M250 240H350V195',pd,false);line('M350 195H440',pd);line('M580 195H720',pd);
  txt(190,340,'B7 on APC','APC 上的 B7');txt(510,340,'CTLA-4','T 細胞上的 CTLA-4');txt(830,340,'T-cell inhibition','T 細胞活性受抑制',ct);line('M275 335H440',ct);line('M580 335H720',ct);
  s+='<path d="M60 385H340M680 385H940" stroke="#dce3e5" stroke-width="1"/><text x="60" y="415" style="font-size:15px;fill:#627482">Antibody-directed B-cell clearance</text>';
  txt(190,505,'CD20 on B cell','B 細胞上的 CD20');txt(510,505,cd?'Rituximab binding':'No therapeutic antibody',cd?'Rituximab 與 CD20 結合':'尚無治療性抗體');txt(830,505,cd?'ADCC / complement lysis':'No drug-induced clearance',cd?'ADCC／補體溶解':'尚無藥物誘發的清除');
  if(cd){line('M300 500H380');line('M640 500H695');}
  if(pl)txt(800,275,'PD-L2 signaling preserved','保留 PD-L2 → PD-1 抑制訊號');
  if(a){if(pl)tag(190,35,122);else if(pd)tag(510,35,167);else if(ct)tag(800,240,307,'inhibit',510);else if(cd)tag(510,365,472,'promote');}

 }
 return s;
}

 if(t.id==='irinotecan-metabolism'){

 }else{
  n(160,270,'DHF','二氫葉酸');n(490,270,'DHFR','二氫葉酸還原酶');n(820,270,'Reduced folate','還原型葉酸');l('M215 265H420');l('M555 265H705',!!a);
  n(820,455,'Nucleotide synthesis','核苷酸合成');l('M820 320V410');
  if(a){n(490,110,'Methotrexate','MTX 阻斷');bar('M490 150V235',490,235);n(820,110,'Leucovorin','救援用藥');l('M820 155V235');n(640,190,'Bypass the DHFR block','繞過 DHFR 阻斷');}
 }
 return s;
}

function graph(t,a){

}

let layoutWidth=0;
function reserveLayout(){
 const width=$('#members').getBoundingClientRect().width;
 if(width===layoutWidth)return;layoutWidth=width;
