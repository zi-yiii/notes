 const panel=document.createElement('div');panel.className='comparison-panel';panel.hidden=true;panel.innerHTML='<p class="table-count" aria-live="polite"></p><div class="comparison-scroll" role="region" aria-label="Drug comparison table" tabindex="0"><table><colgroup><col><col><col><col></colgroup><thead><tr><th scope="col">Drug / class</th><th scope="col">Main uses</th><th scope="col">Adverse effects</th><th scope="col">Distinctions / precautions</th></tr></thead><tbody></tbody></table></div>';individual.before(panel);
 const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 function view(which){const table=which==='table';individual.hidden=table;panel.hidden=!table;if(legacy){document.querySelector('#count').hidden=table;document.querySelector('#recall').hidden=table;}nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===which));}
 nav.querySelectorAll('button').forEach(b=>b.onclick=()=>view(b.dataset.view));
 function render(){const needle=(input?.value||'').trim().toLowerCase(),found=rows.filter(r=>!needle||r.search.toLowerCase().includes(needle));panel.querySelector('.table-count').textContent=found.length+' / '+rows.length+(legacy?' drugs · 藥物':' groups · 類別／藥物組');const groups=new Map();found.forEach(r=>{if(!groups.has(r.group))groups.set(r.group,[]);groups.get(r.group).push(r)});const tbody=panel.querySelector('tbody');tbody.innerHTML=[...groups].map(([group,rs])=>'<tr class="class-row"><th colspan="4" scope="colgroup">'+esc(group)+'<span class="class-mechanism">→ '+esc(rs[0].mechanismEn)+'</span>'+(rs[0].mechanismZh?'<span class="class-mechanism-zh">'+esc(rs[0].mechanismZh)+'</span>':'')+'</th></tr>'+rs.map(r=>'<tr><th scope="row"><button type="button" class="drug-open" data-row="'+r.id+'">'+esc(r.name)+'</button>'+((new Set(rs.map(x=>x.individualMechanism)).size>1)?'<span class="drug-mechanism">機轉差異：'+esc(r.individualMechanism)+'</span>':'')+'</th><td>'+esc(r.use)+(r.zhUse?'<span class="zh-small">'+esc(r.zhUse)+'</span>':'')+'</td><td>'+esc(r.risk)+(r.zhRisk?'<span class="zh-small">'+esc(r.zhRisk)+'</span>':'')+'</td><td>'+esc(r.note)+(r.zhNote?'<span class="zh-small">'+esc(r.zhNote)+'</span>':'')+'</td></tr>').join('')).join('')||'<tr><td colspan="4">No matching drug · 找不到符合的藥物</td></tr>';tbody.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{const row=rows.find(r=>r.id===Number(b.dataset.row));view('individual');if(legacy){const target=[...document.querySelectorAll('#list [data-name]')].find(n=>n.dataset.name===row.name);target?.click();}else{const article=individual.querySelectorAll('article')[row.id];article?.setAttribute('tabindex','-1');article?.focus();}});}
 input?.addEventListener('input',render);document.querySelector('#unit')?.addEventListener('change',render);render();if(location.hash==='#compare')view('table');
})();</script></html>
