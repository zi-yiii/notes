PA decarboxylase，代謝物 α-methyl-NE 才活化 α₂。", "dim": ["sns", "b1", "co", "a1", "svr", "join"], "kind": "promote", "tip": null}, {"label": "β blockers|β 阻斷劑", "target": "b1", "x": 480, "y": 80, "members": ["Atenolol", "Bisoprolol", "Metoprolol", "Propranolol", "Esmolol"], "effect": "Cardiac β₁ blockade → HR / contractility ↓; renal β₁ blockade also reduces renin.|阻斷心臟 β₁ 降低心率與收縮力；腎臟 β₁ 阻斷另可降低 renin。", "dim": ["co"], "kind": "inhibit", "tip": null}, {"label": "α₁ blockers|α₁ 阻斷劑", "target": "a1", "x": 480, "y": 600, "members": ["Prazosin", "Doxazosin", "Terazosin"], "effect": "Vascular α₁ blockade → resistance ↓; watch first-dose orthostasis.|阻斷血管 α₁ 降低周邊阻力，注意首次劑量姿勢性低血壓。", "dim": ["svr"], "kind": "inhibit", "tip": null}, {"label": "Mixed α₁ / β blockers|混合 α₁／β 阻斷劑", "target": "b1", "x": 480, "y": 80, "members": ["Labetalol", "Carvedilol"], "effect": "β blockade lowers cardiac drive; α₁ blockade lowers vascular tone.|β 阻斷降低心臟驅動，α₁ 阻斷降低血管張力。", "dim": ["co", "svr"], "kind": "inhibit", "tip": null, "extra": [{"target": "a1", "x": 480, "y": 600, "kind": "inhibit", "label": "α₁ blockade|α₁ 阻斷"}]}], "h": 710}, {"id": "raas", "title": "RAAS|腎素系統", "pages": "38–52", "nodes": [{"id": "agt", "x": 150, "y": 180, "label": "Angiotensinogen|血管張力素原"}, {"id": "renin", "x": 450, "y": 180, "label": "Renin|腎素"}, {"id": "ang1", "x": 790, "y": 180, "label": "Angiotensin I|血管張力素 I"}, {"id": "ace", "x": 790, "y": 340, "label": "ACE|轉換酶"}, {"id": "ang2", "x": 450, "y": 340, "label": "Angiotensin II|血管張力素 II"}, {"id": "at1", "x": 150, "y": 340, "label": "AT₁ receptor|AT₁ 受體"}, {"id": "vascular", "x": 150, "y": 530, "label": "Vasoconstriction|血管收縮"}, {"id": "aldo", "x": 490, "y": 530, "label": "Aldosterone|醛固酮"}, {"id": "volume", "x": 830, "y": 530, "label": "Na⁺ / water retention|鈉與水滯留"}], "edges": [{"a": "agt", "b": "renin", "path": "M280 174H390", "kind": "arrow"}, {"a": "renin", "b": "ang1", "path": "M505 174H685", "kind": "arrow"}, {"a": "ang1", "b": "ace", "path": "M790 220V303", "kind": "a , "label": "cGMP → PKG → MLCP|cGMP 活化磷酸酶路徑"}, {"id": "relax", "x": 825, "y": 475, "label": "Relaxation|血管舒張"}], "edges": [{"a": "ca", "b": "calcium", "path": "M320 224H390", "kind": "arrow"}, {"a": "calcium", "b": "contract", "path": "M595 224H700", "kind": "arrow"}, {"a": "sgc", "b": "cgmp", "path": "M325 469H380", "kind": "arrow"}, {"a": "cgmp", "b": "relax", "path": "M660 469H750", "kind": "arrow"}], "opts": [{"label": "DHP calcium blockers|DHP 鈣離子阻斷劑", "target": "ca", "x": 190, "y": 110, "members": ["Nifedipine", "Amlodipine", "Felodipine", "Nimodipine"], "effect": "Less Ca²⁺ entry → arteriolar relaxation → afterload ↓.|減少鈣流入，舒張小動脈、降低後負荷。", "dim": ["calcium", "contract"], "kind": "inhibit", "tip": null}, {"label": "NO donors|一氧化氮供體", "target": "sgc", "x": 190, "y": 360, "members": ["Sodium nitroprusside", "Nitroglycerin"], "effect": "NO activates soluble GC → cGMP ↑ → smooth-muscle relaxation.|NO 活化可溶性 GC，使 cGMP 上升並舒張血管。", "dim": [], "kind": "promote", "tip": null}], "h": 590}, {"id": "other-vasodilators", "title": "Other vasodilators|其他血管擴張機轉", "pages": "26, 32–34", "nodes": [{"id": "k", "x": 190, "y": 220, "label": "K⁺ channel opening|鉀離子通道開啟"}, {"id": "hyper", "x": 510, "y": 220, "label": "Hyperpolarization|細胞膜過極化"}, {"id": "ca", "x": 820, "y": 220, "label": "Ca²⁺ entry ↓|鈣離子流入減少"}, {"id": "d1", "x": 190, "y": 450, "label": "D₁ receptor → cAMP|D₁ 受體與 cAMP"}, {"id": "relax", "x": 510, "y": 450, "label": "Arteriolar relaxation|小動脈舒張"}, {"id": "svr", "x": 820, "y": 450, "label": "SVR ↓|周邊阻力下降"}], "edges": [{"a": "k", "b": "hyper", "path": "M310 214H410", "kind": "arrow"}, {"a": "hyper", "b": "ca", "path": "M620 214H720", "kind": "arrow"}, {"a": "ca", "b": "relax", "path": "M820 260V335H510V414", "kind": "arrow"}, {"a": "d1", "b": "relax", "path": "M305 444H395", "kind": "arrow"}, {"a": "relax", "b": "svr", "path": "M635 444H750", "kind": "arrow"}], "opts": [{"label": "K⁺ channel openers|鉀離子通道開啟劑", "target": "k", "x": 190, "y": 100, "members": ["Minoxidil", "Diaz regnancy list.|缺血性心絞痛不選帶 ISA 的藥。 講義標 β₁(ISA+) 為 P，但 p.24 懷孕早期不建議，口頭妊娠盤點未列 β。", "pages": "20–21", "topic": null}, {"group": "α + β blockers", "name": "Labetalol / carvedilol", "moa": "α₁ plus β blockade|兼具 α₁ 與 β 阻斷", "use": "Hypertension; carvedilol also in chronic HFrEF|高血壓；Carvedilol 另用於慢性 HFrEF", "ae": "Hypotension; bradycardia; bronchospasm|低血壓、心搏過慢、支氣管痙攣", "caution": "Carvedilol HF role is distinct from acute inotrope use.|心衰竭長期角色不同於急性強心劑。", "pages": "20–24", "topic": "sympathetic"}, {"group": "β blockers", "name": "Nebivolol / betaxolol / celiprolol", "moa": "β₁ selectivity with distinct additional properties|具 β₁ 選擇性但附加特性不同", "use": "Nebivolol: hypertension; betaxolol: glaucoma example|Nebivolol 降壓；Betaxolol 為青光眼例子", "ae": "β-blocker class effects|β 阻斷劑類別不良反應", "caution": "Nebivolol potentiates NO; celiprolol has β₂ partial agonism.|Nebivolol 增強 NO；Celiprolol 帶 β₂ 部分致效作用。", "pages": "22", "topic": null}, {"group": "DHP calcium blockers", "name": "Nifedipine / amlodipine / felodipine", "moa": "Vascular L-type Ca²⁺ blockade|阻斷血管 L 型鈣通道", "use": "Hypertension / angina; lecture marks DHP class (P), with nifedipine / amlodipine as pregnancy-usable examples.|高血壓／心絞痛；講義標 DHP 類為 P，以 Nifedipine／Amlodipine 為懷孕可用例子。", "ae": "Ankle edema; flushing; headache; reflex tachycardia|腳踝水腫、潮紅、頭痛、反射心搏加速", "caution": "Short-acting nifedipine differs from long-acting formulations. 10/27 p.31 lists acute MI as a CCB contraindication; 11/03 specifically warns against immediate-release short-acting CCBs in unstable angina / AMI.|短效 Nifedipine 與長效製劑須區分。 10/27 p.31 將急性心肌梗塞列為 CCB 禁忌；11/03 則特別警告不穩定心絞痛／AMI 避免速放短效製劑。", "pages": "27–31", "topic": "vascular"}, {"group": "DHP calcium blockers", "name": "Nimodipine", "moa": "Vascular L-type Ca²⁺ blockade|阻斷血管 L 型鈣通道", "use": "Neurologic ischemic injury after subarachnoid hemorrhage|蜘蛛膜下腔出血後缺血性神經損傷", "ae": "Hypotension; headache|低血壓、頭痛", "caution": "Cerebral use after subarachnoid hemorrhage: vasospasm / ischemic neurologic injury, rather than r const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let zh=false,mode='table';const params=new URLSearchParams(location.search);document.body.classList.toggle('embed',params.get('embed')==='1');
function label(s){const [en,cn]=String(s).split('|');return esc(en)+(zh&&cn?'<span class="cnline">'+esc(cn)+'</span>':'')}
function mechanismLink(d){return d.topic?`<a href="${U.id}-mechanisms.html#${d.topic}">↗ Mechanism</a>`:''}
function render(){
 const search=document.querySelector('input');search.hidden=!['table','cards'].includes(mode);const query=search.value.toLowerCase();const ds=U.drugs.filter(d=>Object.values(d).join(' ').toLowerCase().includes(query));let prev='',out='';
 const supp=(U.supplements||[]).find(v=>v.id===mode);
 if(supp){out='<article><h2>'+label(supp.title)+'</h2><p>'+label(supp.note)+'</p><div class="scroll"><table class="supp-table"><thead><tr>'+supp.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+supp.rows.map(row=>'<tr>'+row.map(c=>'<td>'+label(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></article>'}
 else if(!ds.length){out='<p role="status">'+label('No matches|沒有符合的項目')+'</p>'}
 else if(mode==='table'){out='<div class="scroll"><table><thead><tr>'+['Drug / class','Mechanism','Main uses','Adverse effects','Distinctions / cautions'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+ds.map(d=>{const group=d.group!==prev;prev=d.group;return `<tr class="${group?'group':''}"><td>${esc(d.name)}<span class="cnline">${esc(d.group)}</span>${mechanismLink(d)}</td>`+['moa','use','ae','caution'].map(k=>'<td>'+label(d[k])+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>'}
 else{out=ds.map(d=>`<article><h2>${esc(d.name)}</h2><span class="cnline">${esc(d.group)}</span><dl>`+['moa','use','ae','caution'].map((k,i)=>'<dt>'+['Mechanism','Main uses','Adverse effects','Distinctions'][i]+'</dt><dd>'+label(d[k])+'</dd>').join('')+`</dl>${mechanismLink(d)}</article>`).join('')}
 document.querySelector('#results').innerHTML=out;document.querySelector('#zh').textContent=zh?'Hide 中文':'Show 中文';document.querySelector('#zh').setAttribute('aria-pressed',String(zh));document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===mode));
}
const tabs=document.querySelector('[data-mode]').parentElement;for(const t of U.supplements||[]){const b=document.createElement('button');b.dataset.mode=t.id;b.setAttribute('role','tab');b.textContent=t.title.split('|')[0];tabs.append(b)}
document.querySelector('#zh').onclick=()=>{zh=!zh;render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});document.querySelector('input').oninput=render;render();

</script></body></html>
