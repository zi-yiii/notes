</style></head><body><main><nav class="top"><a href="../../../index.html">⌂</a><a href="index.html">Block 3</a></nav><h1>Antianginal drugs</h1><div class="tools"><a href="03-reference.html">Drug reference / Compare</a><button id="zh" aria-pressed="false">Show 中文</button></div><div class="tabs" role="tablist" aria-label="Topics" id="topic-tabs"></div><div class="tabs classes" role="tablist" aria-label="Drug classes" id="class-tabs"></div><div class="drawing"><svg class="map" role="img"></svg></div><section class="members" id="members"></section></main><script>const U={"id": "03", "title": "Antianginal drugs", "cn": "冠狀動脈病用藥", "file": "藥-20261103-1-冠狀動脈病用藥.pdf", "preview": false, "topics": [{"id": "oxygen", "title": "Oxygen supply / demand|氧供需", "pages": "6–13, 24–29", "nodes": [{"id": "vein", "x": 160, "y": 210, "label": "Venous return|靜脈回流"}, {"id": "stress", "x": 500, "y": 210, "label": "Preload / wall stress|前負荷與心室壁張力"}, {"id": "demand", "x": 830, "y": 210, "label": "O₂ demand|心肌耗氧"}, {"id": "heart", "x": 500, "y": 390, "label": "Heart rate / contractility|心率與收縮力"}, {"id": "artery", "x": 170, "y": 565, "label": "Coronary spasm|冠狀動脈痙攣"}, {"id": "supply", "x": 830, "y": 565, "label": "O₂ supply ↓|氧供應下降"}], "edges": [{"a": "vein", "b": "stress", "path": "M265 204H375", "kind": "arrow"}, {"a": "stress", "b": "demand", "path": "M630 204H740", "kind": "arrow"}, {"a": "heart", "b": "demand", "path": "M630 384H830V248", "kind": "arrow"}, {"a": "artery", "b": "supply", "path": "M300 559H720", "kind": "arrow"}], "opts": [{"label": "Organic nitrates|有機硝酸酯", "target": "vein", "x": 160, "y": 90, "members": ["Nitroglycerin", "Isosorbide dinitrate", "Isosorbide mononitrate"], "effect": "Venodilation → preload / wall stress ↓; also relieves coronary spasm.|擴張靜脈降低前負荷與壁張力，也可緩解冠狀動脈痙攣。", "dim": ["stress", "demand"], "kind": "inhibit", "tip": null}, {"label": "β blockers (no ISA)|不帶 ISA 的 β 阻斷劑", "target": "heart", "x": 500, "y": 285, "members": ["Metoprolol", "Atenolol", "Propranolol"], "effect": "HR / contractility ↓ → O₂ demand ↓; not the choice for isolated vasospasm.|降低心率與收縮力以減少耗氧；不選用於單純痙攣型心絞痛。", "dim": ["demand"], "kind": "inhibit", "tip": null}, {"label": "Calcium channel blockers|鈣離子通道阻斷劑", "target": "artery", "x": 170, "y": 450, "members": ["Amlodipine", "Nifedipine", "Verapamil", "Diltiazem"], "effect": "Relieves coronary spasm / reduces afterload; non-DHP drugs additionally slow nodal activity.|緩解冠脈痙攣、降低後負荷；非 DHP 類另減慢結細胞活動。", "dim": ["supply"], "kind": "inhibit", "tip": null}], "h": 650}, {"id": "no", "title": "NO / cGMP|一氧化氮路徑", "pages": "11, 14–22, 38", "nodes": [{"id": "ntg", "x": 170, "y": 200, "label": "Organic nitrate bioactivation|有機硝酸酯活化"}, {"id": "no", "x": 500, "y": 200, "label": "NO|一氧化氮"}, {"id": "gc", "x": 830, "y": 200, "label": "Soluble GC|可溶性 GC"}, {"id": "cgmp", "x": 830, "y": 420, "label": "cGMP|環鳥苷酸"}, {"id": "mlcp", "x": 500, "y": 420, "label": "PKG → MLCP|PKG 活化 MLCP"}, {"id": "relax", "x": 170, "y": 420, "label": "Smooth-muscle relaxation|平滑肌舒張"}], "edges": [{"a": "ntg", "b": "no", "path": "M310 194H455", "kind": "arrow"}, {"a": "no", "b": "gc", "path": "M540 194H735", "kind": "arrow"}, {"a": "gc", "b": "cgmp", "path": "M830 240V383", "kind": "arrow"}, {"a": "cgmp", "b": "mlcp", "path": "M775 414H620", "kind": "arrow"}, {"a": "mlcp", "b": "relax", "path": "M390 414H310", "kind": "arrow"}], "opts": [{"label": "Organic nitrates|有機硝酸酯", "target": "no", "x": 500, "y": 80, "members": ["Nitroglycerin", "Isosorbide dinitrate", "Isosorbide mononitrate"], "effect": "NTG uses ALDH2-dependent bioactivation → NO signaling. Continuous exposure can produce tolerance.|NTG 經 ALDH2 相關活化產生 NO 訊號；持續暴露可產生耐受。", "dim": [], "kind": "promote", "tip": null}], "h": 540}, {"id": "late-na", "title": "Late Na⁺ / If|晚期鈉電流與 If", "pages": "35–36", "nodes": [{"id": "na", "x": 170, "y": 210, "label": "Late INa|晚期內向鈉電流"}, {"id": "overload", "x": 500, "y": 210, "label": "Na⁺ / Ca²⁺ overload|鈉與鈣負荷增加"}, {"id": "tension", "x": 830, "y": 210, "label": "Diastolic wall tension|舒張期壁張力"}, {"id": "if", "x": 170, "y": 450, "label": "SA-node If|竇房結 If"}, {"id": "hr", "x": 500, "y": 450, "label": "Heart rate|心率"}, {"id": "demand", "x": 830, "y": 450, "label": "O₂ demand|心肌耗氧"}], "edges": [{"a": "na", "b": "overload", "path": "M285 204H370", "kind": "arrow"}, {"a": "overload", "b": "tension", "path": "M630 204H705", "kind": "arrow"}, {"a": "if", "b": "hr", "path": "M265 444H425", "kind": "arrow"}, {"a": "hr", "b": "demand", "path": "M575 444H730", "kind": "arrow"}], "opts": [{"label": "Late INa inhibitors|晚期鈉電流抑制劑", "target": "na", "x": 170, "y": 95, "members": ["Ranolazine"], "effect": "Reduces late Na⁺ influx and Ca²⁺ overload → diastolic tension ↓; QT can still prolong.|減少晚期鈉流入及鈣負荷，降低舒張壁張力；仍可能延長 QT。", "dim": ["overload", "tension"], "kind": "inhibit", "tip": null}, {"label": "If inhibitors|If 抑制劑", "target": "if", "x": 170, "y": 335, "members": ["Ivabradine"], "effect": "Slows SA-node firing; needs sinus rhythm.|減慢竇房結放電，需竇性心律。", "dim": ["hr", "demand"], "kind": "inhibit", "tip": null}], "h": 550}, {"id": "thrombosis", "title": "Plaque / platelet / clot|斑塊、血小板與凝血", "pages": "7–8, 40–41", "nodes": [{"id": "cox", "x": 180, "y": 190, "label": "Platelet COX → TXA₂|血小板 COX 生成 TXA₂"}, {"id": "p2y", "x": 180, "y": 430, "label": "ADP → P2Y₁₂|ADP 活化 P2Y₁₂"}, {"id": "activation", "x": 500, "y": 310, "label": "Platelet activation|血小板活化"}, {"id": "gpii", "x": 820, "y": 310, "label": "GP IIb/IIIa|纖維蛋白原結合受體"}, {"id": "aggregate", "x": 820, "y": 560, "label": "Platelet aggregation|血小板聚集"}], "edges": [{"a": "cox", "b": "join", "path": "M315 184H365V304", "kind": "none"}, {"a": "p2y", "b": "join", "path": "M295 424H365V304", "kind": "none"}, {"a": "join", "b": "activation", "path": "M365 304H390", "kind": "arrow"}, {"a": "activation", "b": "gpii", "path": "M615 304H745", "kind": "arrow"}, {"a": "gpii", "b": "aggregate", "path": "M820 350V524", "kind": "arrow"}], "opts": [{"label": "COX inhibitors|COX 抑制劑", "target": "cox", "x": 180, "y": 75, "members": ["Aspirin"], "effect": "Platelet COX inhibition → TXA₂ ↓ → aggregation ↓.|抑制血小板 COX，減少 TXA₂ 與聚集。", "dim": ["activation", "gpii", "aggregate"], "kind": "inhibit", "tip": null}, {"label": "P2Y₁₂ antagonists|P2Y₁₂ 拮抗劑", "target": "p2y", "x": 180, "y": 550, "members": ["Clopidogrel", "Ticagrelor"], "effect": "Blocks ADP-mediated P2Y₁₂ activation.|阻斷 ADP 經 P2Y₁₂ 活化血小板。", "dim": ["activation", "gpii", "aggregate"], "kind": "inhibit", "tip": null}, {"label": "GP IIb/IIIa antagonists|GP IIb/IIIa 拮抗劑", "target": "gpii", "x": 820, "y": 190, "members": ["Abciximab"], "effect": "Prevents fibrinogen-mediated platelet bridging.|阻斷纖維蛋白原橋接血小板。", "dim": ["aggregate"], "kind": "inhibit", "tip": null}], "h": 640}, {"id": "coagulation", "title": "Coagulation|凝血", "pages": "7–8, 40", "nodes": [{"id": "coag", "x": 160, "y": 230, "label": "Coagulation cascade|凝血級聯"}, {"id": "factors", "x": 500, "y": 230, "label": "Factor Xa / thrombin|第 Xa 因子與凝血酶"}, {"id": "fibrin", "x": 835, "y": 230, "label": "Fibrin formation|纖維蛋白形成"}], "edges": [{"a": "coag", "b": "factors", "path": "M290 224H365", "kind": "arrow"}, {"a": "factors", "b": "fibrin", "path": "M640 224H720", "kind": "arrow"}], "opts": [{"label": "Anticoagulants|抗凝血藥", "target": "factors", "x": 500, "y": 110, "members": ["Heparin", "Enoxaparin"], "effect": "Antithrombin-mediated factor inhibition reduces fibrin formation; Xa / IIa profiles differ.|藉抗凝血酶抑制凝血因子以減少纖維蛋白，Xa／IIa 比例不同。", "dim": ["fibrin"], "kind": "inhibit", "tip": null}], "h": 640}], "drugs": [{"group": "Organic nitrates", "name": "Nitroglycerin", "moa": "Bioactivation → NO / cGMP; venodilation predominates|活化後經 NO／cGMP，偏靜脈擴張", "use": "Acute angina relief (sublingual); other routes for prevention / hospital use|舌下急性緩解；其他劑型用於預防或住院情境", "ae": "Headache; flushing; hypotension; reflex tachycardia; tolerance|頭痛、潮紅、低血壓、反射心搏加速、耐受", "caution": "Avoid PDE5 inhibitor co-use; caution preload-dependent RV infarct; route matters. Lecture contraindications: hypotension, aortic stenosis, HOCM, raised intracranial pressure; p.20 permits glaucoma use.|不可與 PDE5 抑制劑併用；右室梗塞依賴前負荷時謹慎；區分劑型。 講義禁忌另含低血壓、主動脈瓣狹窄、肥厚性阻塞型心肌病、顱內壓升高；p.20 記青光眼可用。", "pages": "11–22", "topic": "no"}, {"group": "Organic nitrates", "name": "Isosorbide dinitrate / mononitrate", "moa": "NO / cGMP → venodilation → preload ↓|NO／cGMP 擴張靜脈、降低前負荷", "use": "Angina prophylaxis; HF contexts|心絞痛預防、部分心衰竭情境", "ae": "Headache; hypotension; tolerance|頭痛、低血壓、耐受", "caution": "Maintain prescribed nitrate-free interval; no PDE5 inhibitor combination. Lecture contraindications: hypotension, aortic stenosis, HOCM, raised intracranial pressure; p.20 permits glaucoma use.|依處方保留無硝酸酯間隔；不與 PDE5 抑制劑併用。 講義禁忌另含低血壓、主動脈瓣狹窄、肥厚性阻塞型心肌病、顱內壓升高；p.20 記青光眼可用。", "pages": "13, 16–22", "topic": "no"}, {"group": "β blockers without ISA", "name": "Metoprolol / atenolol / propranolol", "moa": "HR and contractility ↓ → oxygen demand ↓|降低心率及收縮力，減少耗氧", "use": "Stable effort angina; post-MI contexts|穩定勞動型心絞痛、梗塞後情境", "ae": "Bradycardia; AV block; bronchospasm (nonselective)|心搏過慢、AV 阻斷；非選擇性藥可致支氣管痙攣", "caution": "Avoid ISA agents for angina; not for isolated Prinzmetal vasospasm.|心絞痛避免 ISA 藥；不選於單純 Prinzmetal 痙攣。", "pages": "24–26, 38", "topic": "oxygen"}, {"group": "DHP calcium blockers", "name": "Amlodipine / nifedipine", "moa": "Vasodilation → afterload ↓ / spasm relief|血管擴張、降低後負荷並緩解痙攣", "use": "Stable / variant angina|穩定型／變異型心絞痛", "ae": "Edema; flushing; headache; reflex tachycardia|水腫、潮紅、頭痛、反射心搏加速", "caution": "Avoid immediate-release short-acting formulations in unstable angina / AMI.|不穩定心絞痛／急性梗塞避免速放短效製劑。", "pages": "28–32, 38", "topic": "oxygen"}, {"group": "Non-DHP calcium blockers", "name": "Verapamil / diltiazem", "moa": "Cardiac L-type blockade plus vasodilation|心臟 L 型鈣阻斷兼血管擴張", "use": "Angina including vasospastic contexts|心絞痛，含血管痙攣情境", "ae": "Bradycardia; AV block; HF worsening; constipation|心搏過慢、AV 阻斷、心衰竭惡化、便祕", "caution": "Additive cardiac depression with β blockers; verapamil increases digoxin exposure.|與 β 阻斷劑加成抑制；Verapamil 增加 Digoxin 暴露。", "pages": "28–32, 38", "topic": "oxygen"}, {"group": "Late INa inhibitors", "name": "Ranolazine", "moa": "Late INa ↓ → calcium overload / diastolic tension ↓|晚期鈉電流下降、減少鈣負荷與舒張壁張力", "use": "Persistent chronic angina|持續慢性心絞痛", "ae": "Dizziness; nausea; constipation; QT prolongation|暈眩、噁心、便祕、QT 延長", "caution": "Avoid cirrhosis and strong CYP3A inhibitors / inducers; source dosing discrepancy recorded separately.|肝硬化、強 CYP3A 抑制／誘導劑避免；講義劑量差異另記。", "pages": "35, 38", "topic": "late-na"}, {"group": "If inhibitors", "name": "Ivabradine", "moa": "SA-node If blockade → HR ↓|竇房結 If 阻斷、降低心率", "use": "Selected sinus-rhythm angina when β blockade is insufficient / not tolerated|特定竇性心律且 β 阻斷不足／不耐受的心絞痛", "ae": "Bradycardia; luminous phenomena|心搏過慢、光幻視", "caution": "Sinus rhythm required; strong CYP3A4 inhibitor interaction.|需竇性心律；注意強 CYP3A4 抑制劑。", "pages": "36; 抗心律不整 46–47", "topic": "late-na"}, {"group": "Additional mechanisms", "name": "Trimetazidine / nicorandil", "moa": "Fatty-acid oxidation modulation / KATP opening respectively|分別調節脂肪酸氧化／開啟 KATP", "use": "Additional antianginal examples on lecture list|講義列出的其他抗心絞痛例子", "ae": "Not individually detailed in this lecture|本講未逐藥詳列", "caution": "List includes investigational / historical agents; not a universal treatment recommendation.|列單含研究與歷史藥物，不等於一律建議使用。", "pages": "36", "topic": null}, {"group": "Antiplatelets", "name": "Aspirin / clopidogrel / ticagrelor / abciximab", "moa": "COX / P2Y₁₂ / GP IIb/IIIa are distinct targets|COX／P2Y₁₂／GP IIb/IIIa 為不同靶點", "use": "ACS / thrombotic prevention contexts|ACS／血栓預防情境", "ae": "Bleeding|出血", "caution": "Do not infer identical indications for every platelet drug; source list is context-dependent.|不可將各藥適應症視為相同，需依來源情境。", "pages": "7–8, 40", "topic": "thrombosis"}, {"group": "Anticoagulants", "name": "Heparin / enoxaparin", "moa": "Antithrombin-mediated factor inhibition|透過抗凝血酶抑制凝血因子", "use": "ACS antithrombotic context|ACS 抗血栓情境", "ae": "Bleeding; heparin-related thrombocytopenia|出血、肝素相關血小板低下", "caution": "Different Xa / IIa profiles; not a platelet receptor blocker.|Xa／IIa 作用比例不同，並非血小板受體阻斷。", "pages": "40", "topic": "coagulation"}, {"group": "Plaque risk modification", "name": "Statins", "moa": "Cholesterol / plaque-risk modification|降低膽固醇、調整斑塊風險", "use": "Coronary risk prevention context|冠狀動脈風險預防情境", "ae": "Individual drug toxicity not detailed here|本講未詳列個別藥毒性", "caution": "Not an acute vasodilator.|非急性血管擴張劑。", "pages": "7–8", "topic": null}, {"group": "PAD agents", "name": "Pentoxifylline / cilostazol", "moa": "Reduced blood viscosity / PDE3 inhibition respectively|分別降低血黏度／抑制 PDE3", "use": "PAD / intermittent claudication|周邊動脈病／間歇性跛行", "ae": "Not detailed on source page|來源頁未詳列", "caution": "Separate PAD indication from angina; cilostazol HF warning needs clinical context.|區分 PAD 與心絞痛；Cilostazol 心衰竭禁忌需留意。", "pages": "41", "topic": null}], "supplements": [{"id": "comorbidity", "title": "Angina with comorbid disease|心絞痛合併疾病", "note": "11/03 p.37: dark boxes = commonly used; white boxes = less effective, not forbidden. Choice depends on individual response.|依 11/03 p.37：深色框為常用、白框為較無效而非禁用；選藥仍依個別反應。", "headers": ["Condition", "Commonly used (dark)", "Less effective (white)"], "rows": [["None|無合併疾病", "Long-acting nitrates; β blockers; CCBs|長效硝酸酯、β 阻斷劑、CCB", "—|未列"], ["Recent MI|近期心肌梗塞", "Long-acting nitrates; β blockers|長效硝酸酯、β 阻斷劑", "—|未列"], ["Asthma / COPD|氣喘／COPD", "Long-acting nitrates; CCBs|長效硝酸酯、CCB", "—|未列"], ["Hypertension|高血壓", "β blockers; CCBs|β 阻斷劑、CCB", "Long-acting nitrates|長效硝酸酯"], ["Diabetes|糖尿病", "Long-acting nitrates; CCBs|長效硝酸酯、CCB", "—|未列"], ["Chronic renal disease|慢性腎病", "Long-acting nitrates; CCBs|長效硝酸酯、CCB", "β blockers|β 阻斷劑"]]}]};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pair=s=>String(s||'').split('|');let zh=false,selected=0,choice=0;const choices=U.topics.map(()=>0);const params=new URLSearchParams(location.search);document.body.classList.toggle('embed',params.get('embed')==='1');
function label(s){const [en,cn]=pair(s);return esc(en)+(zh&&cn?'<span class="cnline">'+esc(cn)+'</span>':'')}
function txt(x,y,s,cls='',anchor='middle'){const [en,cn]=pair(s);return `<text class="${cls}" x="${x}" y="${y}" text-anchor="${anchor}">${esc(en)}</text>`+(zh&&cn?`<text class="cn ${cls}" x="${x}" y="${y+23}" text-anchor="${anchor}">${esc(cn)}</text>`:'')}
// Terminal shapes are drawn on each path. No duplicated marker IDs across tabs.
function capPath(d,kind,color){return `<path class="edge" d="${d}" ${kind==='none'?'':'data-cap="'+kind+'"'} style="stroke:${color}"/>`}
function centerBadges(svg){svg.querySelectorAll('g.action').forEach(g=>{const r=g.querySelector('rect.badge'),ts=[...g.querySelectorAll('text')];if(!r||!ts.length)return;const boxes=ts.map(t=>t.getBBox()),top=Math.min(...boxes.map(b=>b.y)),bottom=Math.max(...boxes.map(b=>b.y+b.height)),dy=Number(r.getAttribute('y'))+Number(r.getAttribute('height'))/2-(top+bottom)/2;ts.forEach(t=>t.setAttribute('y',Number(t.getAttribute('y'))+dy));})}
function annotate(svg){svg.querySelectorAll('[data-cap]').forEach(p=>{let l=p.getTotalLength();if(l<1)return;const end=p.getPointAtLength(l),prev=p.getPointAtLength(l-.5);let dx=end.x-prev.x,dy=end.y-prev.y,z=Math.hypot(dx,dy);dx/=z;dy/=z;const q=document.createElementNS('http://www.w3.org/2000/svg','path'),bar=p.dataset.cap==='bar';q.setAttribute('d',bar?`M${end.x-dy*7} ${end.y+dx*7}L${end.x+dy*7} ${end.y-dx*7}`:`M${end.x} ${end.y}L${end.x-dx*8-dy*3.6} ${end.y-dy*8+dx*3.6}L${end.x-dx*8+dy*3.6} ${end.y-dy*8-dx*3.6}Z`);q.setAttribute('fill',bar?'none':p.style.stroke);q.setAttribute('stroke',p.style.stroke);q.setAttribute('stroke-width',bar?'1.8':'0');p.parentElement.append(q)})}
function action(a,nodes){if(!a.target)return '';const t=nodes.find(n=>n.id===a.target),promote=a.kind==='promote',color=promote?'#41856e':'#b34d64',below=a.y>t.y;let start=below?a.y-26:a.y+(zh?48:30),end=below?t.y+43:t.y-21;const lab=a.actionLabel||a.label;const width=Math.max(140,Math.min(305,pair(lab)[0].length*8+30));return `<g class="action"><rect class="badge" x="${a.x-width/2}" y="${a.y-20}" width="${width}" height="${zh?57:38}" rx="4"/>`+txt(a.x,a.y,lab,'drug-label')+capPath(`M${a.x} ${start}V${end}`,promote?'arrow':'bar',color)+'</g>'}
function graph(t,a){let s='';if(t.mode)return ap(t,a);const dims=new Set(a?.dim||[]);t.edges.forEach(ed=>{const dim=dims.has(ed.a)||dims.has(ed.b);s+=`<g class="${dim?'dim':''}">`+capPath(ed.path,ed.kind,'#7892a2')+'</g>'});t.nodes.forEach(nd=>s+=`<g class="node ${dims.has(nd.id)?'dim':''}" data-id="${nd.id}">`+txt(nd.x,nd.y,nd.label)+'</g>');if(a){if(a.result)s+=txt(500,610,a.result,'note');s+=action(a,t.nodes);(a.extra||[]).forEach(x=>s+=action(x,t.nodes))}return s}
function ap(t,a){let s='';const fast=t.mode==='fast',idx=a?(a.curveIndex??t.opts.indexOf(a)):-1;s+=txt(120,60,fast?'Ventricular myocyte|心室肌細胞':(t.cellTitle||'SA / AV nodal cell|竇房結／房室結細胞'),'note','start');s+='<path class="axis" d="M140 120V390H875"/>';s+=txt(100,140,'mV','note');s+=txt(850,425,'Time|時間','note');let normal,changed,caption;
if(fast){normal='M150 365H250L260 145L300 173Q380 165 480 210Q535 250 560 365H855';const paths=['M150 365H250L285 155L330 175Q420 165 540 210Q605 255 635 365H855','M150 365H250L263 150L295 177Q350 180 410 225Q460 280 480 365H855','M150 365H250L330 145L365 173Q430 175 480 210Q535 255 560 365H855','M150 365H250L260 145L300 173Q430 165 565 210Q650 260 675 365H855'];changed=paths[idx];s+=txt(245,105,'0 · INa|第 0 期，鈉流入','note');s+=txt(400,135,'2 · ICa|第 2 期，鈣流入','note');s+=txt(780,265,'3 · IK|第 3 期，鉀外流','note');caption=['Na⁺ block + K⁺ block: QRS ↑ / APD ↑|鈉阻斷加鉀阻斷：QRS 變寬、APD 延長','Fast recovery: APD ↓|恢復快速：APD 縮短','Strong conduction slowing: QRS ↑↑; APD ≈|強烈減慢傳導：QRS 明顯變寬，APD 約不變','K⁺ block: APD / ERP / QT ↑|鉀阻斷：APD／ERP／QT 延長'][idx];
}else{normal='M150 365Q240 330 330 280Q355 150 385 155Q445 165 480 365Q575 330 665 280Q690 150 720 155Q780 165 815 365';changed=idx===1?'M150 365Q240 330 330 280Q385 220 420 210Q465 240 500 365Q595 330 685 280Q735 220 770 210Q815 240 850 365':'M150 365Q310 335 470 280Q495 150 525 155Q585 165 620 365Q700 348 855 305';s+=txt(270,235,'4 · If / ICa|第 4 期，自發去極化','note');s+=txt(530,120,'0 · ICa,L|第 0 期，L 型鈣流入','note');caption=['β blockade: cAMP / automaticity ↓|β 阻斷：cAMP 與自發性下降','Ca²⁺ block: nodal upstroke / conduction ↓|鈣阻斷：結細胞上升相與傳導減慢','If blockade: phase-4 slope ↓|If 阻斷：第 4 期斜率下降'][idx]}
s+=`<path class="baseline" style="${a?'opacity:.3;stroke-dasharray:6 5':''}" d="${normal}"/>`;if(a){s+=`<path class="changed" d="${changed}"/>`;s+=txt(505,470,caption,'note')}else s+=txt(505,470,'Normal physiology · schematic, not a measured trace|正常生理示意，非實測波形','note');return s}
function reserveTabs(){const nav=document.querySelector('#class-tabs'),probe=document.createElement('div');probe.className='tabs classes';probe.style.cssText='position:absolute;visibility:hidden;pointer-events:none;width:'+nav.clientWidth+'px';document.querySelector('main').append(probe);let max=0;for(const t of U.topics){probe.innerHTML=[null,...t.opts].map(v=>'<button style="font-weight:600">'+esc(v?pair(v.label)[0]:'Normal physiology')+'</button>').join('');max=Math.max(max,probe.getBoundingClientRect().height)}probe.remove();nav.style.minHeight=max+'px'}
addEventListener('resize',reserveTabs);document.fonts.ready.then(reserveTabs);
function selectTopic(i,write=true){selected=i;choice=choices[i];if(write)history.replaceState(null,'','#'+U.topics[i].id);render()}
function render(){const t=U.topics[selected],a=choice?t.opts[choice-1]:null;document.querySelector('#topic-tabs').innerHTML=U.topics.map((v,i)=>`<button role="tab" aria-selected="${selected===i}" tabindex="${selected===i?0:-1}" data-topic="${i}">${esc(pair(v.title)[0])}</button>`).join('');document.querySelector('#class-tabs').innerHTML=[null,...t.opts].map((v,i)=>`<button role="tab" aria-selected="${choice===i}" tabindex="${choice===i?0:-1}" data-choice="${i}">${esc(v?pair(v.label)[0]:'Normal physiology')}</button>`).join('');const svg=document.querySelector('svg');svg.setAttribute('viewBox',`0 0 1000 ${Math.max(...U.topics.map(v=>v.h||600))}`);svg.innerHTML=graph(t,a);svg.setAttribute('aria-label',pair(t.title)[0]+' — '+(a?pair(a.label)[0]:'Normal physiology'));centerBadges(svg);annotate(svg);document.querySelector('#members').innerHTML=a?`<h2>${label(a.label)}</h2><p>${label(a.effect)}</p><ul>${a.members.map(v=>'<li>'+esc(v)+'</li>').join('')}</ul>`:`<h2>${label('Normal physiology|正常生理')}</h2>`;document.querySelector('#zh').textContent=zh?'Hide 中文':'Show 中文';document.querySelector('#zh').setAttribute('aria-pressed',String(zh));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>selectTopic(+b.dataset.topic));document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=+b.dataset.choice;choices[selected]=choice;render()})}
document.querySelector('#zh').onclick=()=>{zh=!zh;render()};function fromHash(){const i=U.topics.findIndex(v=>v.id===location.hash.slice(1));selectTopic(Math.max(i,0),false)}addEventListener('hashchange',fromHash);for(const id of ['topic-tabs','class-tabs'])document.getElementById(id).addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const list=[...e.currentTarget.querySelectorAll('button')],j=list.indexOf(document.activeElement),k=e.key==='Home'?0:e.key==='End'?list.length-1:(j+(e.key==='ArrowRight'?1:-1)+list.length)%list.length;list[k].click();e.currentTarget.querySelectorAll('button')[k].focus()});fromHash();reserveTabs();
