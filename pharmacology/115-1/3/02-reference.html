</style></head><body><main><nav class="top"><a href="../../../index.html">⌂</a><a href="index.html">Block 3</a></nav><h1>Antiarrhythmic drugs</h1><div class="tools"><a href="02-mechanisms.html">Mechanisms</a><button id="zh" aria-pressed="false">Show 中文</button></div><div class="tabs" role="tablist"><button data-mode="table" role="tab">Compare</button><button data-mode="cards" role="tab">Individual entries</button></div><input aria-label="Search drugs" placeholder="Search drugs / classes"><div id="results"></div></main><script>const U={"id": "02", "title": "Antiarrhythmic drugs", "cn": "抗心律不整藥", "file": "藥-20261030-1-抗心律不整藥.pdf", "preview": false, "topics": [{"id": "fast-ap", "title": "Fast-response action potential|快反應動作電位", "pages": "5, 12–15, 27–30", "nodes": [], "edges": [], "opts": [{"label": "Class Ia|Ia 類", "target": null, "x": 0, "y": 0, "members": ["Quinidine", "Procainamide", "Disopyramide"], "effect": "Na⁺ blockade slows phase 0; K⁺ blockade prolongs APD / QT. Slide p.15 channel state: open.|鈉通道阻斷減慢第 0 期；鉀通道阻斷延長 APD／QT。 講義 p.15 作用狀態：open。", "dim": [], "kind": "inhibit", "tip": null}, {"label": "Class Ib|Ib 類", "target": null, "x": 0, "y": 0, "members": ["Lidocaine", "Mexiletine", "Phenytoin"], "effect": "Rapid dissociation; APD tends to shorten, particularly in depolarized / ischemic ventricular tissue. Slide p.15 channel state: inactivated.|解離快速，APD 傾向縮短；偏向去極化／缺血心室組織。 講義 p.15 作用狀態：inactivation。", "dim": [], "kind": "inhibit", "tip": null}, {"label": "Class Ic|Ic 類", "target": null, "x": 0, "y": 0, "members": ["Flecainide", "Propafenone"], "effect": "Strong phase-0 / conduction slowing; APD changes little in the class schematic. Slide p.15 class schematic: resting state.|強烈減慢第 0 期與傳導；分類示意中 APD 變化小。 依講義 p.15 的類別示意：resting state。", "dim": [], "kind": "inhibit", "tip": null}, {"label": "Class III|III 類", "target": null, "x": 0, "y": 0, "members": ["Amiodarone", "Dronedarone", "Sotalol"], "effect": "Repolarizing K⁺ blockade → APD / ERP / QT ↑; EAD / torsades risk is drug-dependent.|阻斷再極化鉀通道，延長 APD／ERP／QT；EAD 與扭轉型心律不整風險依藥物而異。", "dim": [], "kind": "inhibit", "tip": null}], "mode": "fast", "h": 520}, {"id": "nodal-ap", "title": "Nodal action potential|結細胞動作電位", "pages": "3–4, 28, 38–47", "nodes": [], "edges": [], "opts": [{"label": "Class II β blockers|II 類 β 阻斷劑", "target": null, "x": 0, "y": 0, "members": ["Esmolol", "Metoprolol", "Propranolol", "Atenolol"], "effect": "β blockade → cAMP ↓ → automaticity / AV conduction ↓.|β 阻斷降低 cAMP，減少自發性與房室傳導。", "dim": [], "kind": "inhibit", "tip": null}, {"label": "Class IV Ca²⁺ blockers|IV 類鈣阻斷劑", "target": null, "x": 0, "y": 0, "members": ["Verapamil", "Diltiazem"], "effect": "Nodal phase 0 uses Ca²⁺; blockade slows AV conduction and prolongs PR.|結細胞第 0 期靠鈣流入，阻斷後減慢 AV 傳導、延長 PR。", "dim": [], "kind": "inhibit", "tip": null}, {"label": "If inhibitors|If 抑制劑", "target": null, "x": 0, "y": 0, "members": ["Ivabradine"], "effect": "Blocks HCN funny current in SA node → phase-4 slope ↓ → HR ↓.|阻斷竇房結 HCN 的 If，使第 4 期斜率下降、心率減慢。", "dim": [], "kind": "inhibit", "tip": null}], "mode": "nodal", "h": 520}, {"id": "adenosine", "title": "Adenosine|腺苷", "pages": "40–45", "nodes": [{"id": "a1", "x": 170, "y": 220, "label": "A₁ receptor → Gi|A₁ 受體與 Gi"}, {"id": "camp", "x": 500, "y": 220, "label": "cAMP / ICa / If ↓|cAMP 與內向電流下降"}, {"id": "slow", "x": 825, "y": 220, "label": "AV conduction ↓|房室結傳導下降"}, {"id": "k", "x": 500, "y": 445, "label": "K⁺ conductance ↑|鉀離子通透性上升"}, {"id": "hyper", "x": 825, "y": 445, "label": "Hyperpolarization|細胞膜過極化"}], "edges": [{"a": "a1", "b": "camp", "path": "M285 214H375", "kind": "arrow"}, {"a": "camp", "b": "slow", "path": "M625 214H715", "kind": "arrow"}, {"a": "a1", "b": "k", "path": "M170 260V439H385", "kind": "arrow"}, {"a": "k", "b": "hyper", "path": "M620 439H720", "kind": "arrow"}, {"a": "hyper", "b": "slow", "path": "M825 409V258", "kind": "arrow"}], "opts": [{"label": "Adenosine|腺苷", "target": "a1", "x": 170, "y": 100, "members": ["Adenosine"], "effect": "A₁ activation briefly suppresses AV-node conduction → can terminate AV-node-dependent PSVT.|活化 A₁，短暫抑制 AV 結傳導，可終止依賴 AV 結的 PSVT。", "dim": [], "kind": "promote", "tip": null}], "h": 550}, {"id": "reentry", "title": "Reentry / triggered activity|再進入與觸發活動", "pages": "6–9, 31, 37, 50", "nodes": [{"id": "circuit", "x": 190, "y": 200, "label": "Reentry circuit|再進入迴路"}, {"id": "excitable", "x": 500, "y": 200, "label": "Recovered tissue|已恢復興奮性的組織"}, {"id": "return", "x": 820, "y": 200, "label": "Returning impulse|回傳的興奮波"}, {"id": "qt", "x": 190, "y": 450, "label": "Excess APD prolongation|動作電位過度延長"}, {"id": "ead", "x": 500, "y": 450, "label": "EAD|早期後去極化"}, {"id": "tdp", "x": 820, "y": 450, "label": "Torsades de pointes|扭轉型心室頻脈"}], "edges": [{"a": "circuit", "b": "excitable", "path": "M305 194H385", "kind": "arrow"}, {"a": "excitable", "b": "return", "path": "M620 194H710", "kind": "arrow"}, {"a": "return", "b": "circuit", "path": "M820 240V300H190V240", "kind": "arrow"}, {"a": "qt", "b": "ead", "path": "M320 444H440", "kind": "arrow"}, {"a": "ead", "b": "tdp", "path": "M555 444H700", "kind": "arrow"}], "opts": [{"label": "ERP-prolonging agents|延長不反應期的藥物", "target": "excitable", "x": 500, "y": 80, "members": ["Class Ia", "Class III"], "effect": "Longer ERP can interrupt a reentry loop; excessive repolarization delay can instead promote EADs.|延長 ERP 可打斷再進入；過度延遲再極化也可能促進 EAD。", "dim": ["return"], "kind": "inhibit", "tip": null}], "h": 540}, {"id": "vagal", "title": "Vagal control|迷走調節", "pages": "41", "nodes": [{"id": "vagal", "x": 180, "y": 270, "label": "Vagal ACh release|迷走神經乙醯膽鹼釋放"}, {"id": "m2", "x": 500, "y": 270, "label": "M₂ receptor signaling|M₂ 受體訊號"}, {"id": "av", "x": 820, "y": 270, "label": "AV conduction ↓|房室結傳導下降"}], "edges": [{"a": "vagal", "b": "m2", "path": "M315 264H380", "kind": "arrow"}, {"a": "m2", "b": "av", "path": "M625 264H710", "kind": "arrow"}], "opts": [{"label": "Cardiac glycosides|強心配醣體", "target": "vagal", "x": 180, "y": 140, "members": ["Digoxin"], "effect": "Increases vagal tone → AV conduction ↓; distinguish this from myocardial Na⁺/K⁺ ATPase inhibition. Lecture wording: muscarinic agonist / vagal stimulation.|提高迷走張力以減慢 AV 傳導，須與心肌鈉鉀幫浦抑制分開理解。 講義用語：muscarinic agonist／vagal stimulation。", "dim": [], "kind": "promote", "tip": null}], "h": 520}], "drugs": [{"group": "Class Ia", "name": "Quinidine", "moa": "Na⁺ + K⁺ blockade; vagolytic activity Slide p.15 state: open.|鈉與鉀通道阻斷，另具抗迷走作用 依講義 p.15：open 狀態。", "use": "Selected Brugada / short-QT arrhythmia storms|特定 Brugada／短 QT 心律不整風暴", "ae": "Cinchonism; diarrhea; QT / torsades; hypotension|金雞納中毒、腹瀉、QT 延長／扭轉型心律不整、低血壓", "caution": "Raises digoxin exposure; vagolysis may increase AV conduction in flutter.|增加 Digoxin 暴露；抗迷走作用可加快心房撲動的 AV 傳導。", "pages": "16–17", "topic": "fast-ap"}, {"group": "Class Ia", "name": "Procainamide", "moa": "Parent Na⁺ blocker; NAPA metabolite has class III activity Slide p.15 state: open.|原藥阻鈉，NAPA 代謝物有 III 類作用 依講義 p.15：open 狀態。", "use": "Atrial and ventricular arrhythmias|心房與心室心律不整", "ae": "Lupus-like syndrome; neutropenia; nausea|類狼瘡、嗜中性球低下、噁心", "caution": "Renal function affects parent / metabolite exposure.|腎功能影響原藥與代謝物暴露。", "pages": "18", "topic": "fast-ap"}, {"group": "Class Ia", "name": "Disopyramide", "moa": "Class Ia Na⁺ blockade with APD prolongation Slide p.15 state: open.|Ia 類鈉阻斷並延長 APD 依講義 p.15：open 狀態。", "use": "Class-list example|講義分類例子", "ae": "Individual adverse effects not detailed in this lecture|本講未詳述個別不良反應", "caution": "Do not infer identical toxicity to quinidine.|不可將 Quinidine 毒性整套套用。", "pages": "15", "topic": "fast-ap"}, {"group": "Class Ib", "name": "Lidocaine", "moa": "Use-dependent Na⁺ blockade; fast recovery Slide p.15 state: inactivation.|使用依賴性鈉阻斷、恢復快速 依講義 p.15：inactivation 狀態。", "use": "IV ventricular arrhythmias, especially acute ischemia / MI|靜脈治療心室心律不整，尤其急性缺血／梗塞", "ae": "CNS toxicity; infra-Hisian block|中樞毒性、His 束以下傳導阻斷", "caution": "Not useful for AF / flutter in this lecture.|本講不適用於 AF／心房撲動。", "pages": "20", "topic": "fast-ap"}, {"group": "Class Ib", "name": "Mexiletine", "moa": "Oral Na⁺ / late INa blockade Slide p.15 state: inactivation.|口服鈉通道／晚期鈉電流阻斷 依講義 p.15：inactivation 狀態。", "use": "Ventricular arrhythmias; LQT3|心室心律不整、LQT3", "ae": "Metallic taste; GI upset; tremor; thrombocytopenia|金屬味、腸胃不適、顫抖、血小板低下", "caution": "Monitor hematologic effects emphasized in transcript.|逐字稿強調注意血液不良反應。", "pages": "22", "topic": "fast-ap"}, {"group": "Class Ib", "name": "Phenytoin", "moa": "Class Ib example Slide p.15 state: inactivation.|Ib 類例子 依講義 p.15：inactivation 狀態。", "use": "Classification only on this slide|此頁為分類列名", "ae": "Not detailed in this lecture|本講未詳述", "caution": "Do not treat list membership as a routine first-choice indication.|列名不等於常規首選。", "pages": "15", "topic": "fast-ap"}, {"group": "Class Ic", "name": "Flecainide", "moa": "Strong Na⁺ blockade; also RyR2 effects in CPVT Slide p.15 state: resting.|強鈉阻斷；CPVT 另涉及 RyR2 依講義 p.15：resting 狀態。", "use": "Selected SVT / VT; CPVT|特定上心室／心室心律不整、CPVT", "ae": "Proarrhythmia; marked conduction / QRS slowing|促心律不整、明顯傳導減慢／QRS 變寬", "caution": "Avoid structural / ischemic heart disease (CAST).|結構性／缺血性心臟病避免。", "pages": "24", "topic": "fast-ap"}, {"group": "Class Ic", "name": "Propafenone", "moa": "Na⁺ blockade; weak β blockade Slide p.15 state: resting.|鈉阻斷，兼弱 β 阻斷 依講義 p.15：resting 狀態。", "use": "Primarily supraventricular arrhythmias|主要治療上心室心律不整", "ae": "Proarrhythmia; conduction slowing|促心律不整、傳導減慢", "caution": "CYP2D6 metabolism; avoid structural heart disease.|CYP2D6 代謝；結構性心臟病避免。", "pages": "24–25", "topic": "fast-ap"}, {"group": "Class II", "name": "Esmolol / metoprolol / propranolol / atenolol", "moa": "β blockade → automaticity and AV conduction ↓|β 阻斷，降低自發性與 AV 傳導", "use": "SV arrhythmias; adrenergic-triggered rhythms Esmolol: short IV β₁ blockade for perioperative arrhythmia prevention (teacher emphasis).|上心室及交感驅動的心律不整 Esmolol：短效靜脈 β₁ 阻斷，用於手術期間預防心律不整，為老師強調項目。", "ae": "Bradycardia; AV block; bronchospasm risk varies|心搏過慢、AV 阻斷；支氣管痙攣風險因藥而異", "caution": "Esmolol is short-acting IV; do not generalize across formulations. Transcript says half-life <20 min; label elimination half-life ≈9 min, not ≈20 min.|Esmolol 為短效靜脈藥，不可忽略劑型。 逐字稿說半衰期不到 20 分鐘；仿單排除半衰期約 9 分鐘，不是約 20 分鐘。", "pages": "27–28, 49", "topic": "nodal-ap"}, {"group": "Class III", "name": "Amiodarone", "moa": "Multiple K⁺ / Na⁺ / Ca²⁺ channels and adrenergic effects|多種鉀／鈉／鈣通道與抗交感作用", "use": "Serious ventricular arrhythmias; AF|嚴重心室心律不整、AF", "ae": "Pulmonary fibrosis; thyroid dysfunction; corneal deposits; hepatic injury; blue-gray skin|肺纖維化、甲狀腺失調、角膜沉積、肝傷害、藍灰皮膚", "caution": "Very long half-life (20–100 days in lecture); QT prolongation ≠ equal torsades risk across drugs.|課堂半衰期 20–100 天；QT 延長不代表各藥扭轉風險相同。", "pages": "32–33", "topic": "fast-ap"}, {"group": "Class III", "name": "Dronedarone", "moa": "Noniodinated multichannel blocker|不含碘的多通道阻斷藥", "use": "Selected nonpermanent AF / flutter|特定非永久性 AF／心房撲動", "ae": "GI effects; bradycardia; QT; hepatic / pulmonary injury can occur|腸胃反應、心搏過慢、QT；仍可能肝／肺傷害", "caution": "Contraindicated in permanent AF and recent decompensated / NYHA IV HF. No iodine ≠ no lung toxicity. Lecture p.34: lacks thyroid / pulmonary toxicity. Current label still lists hepatic injury and interstitial lung disease.|永久性 AF、近期失代償／NYHA IV 心衰竭禁用；無碘不等於無肺毒性。 講義 p.34：缺乏甲狀腺／肺毒性；現行仿單仍列肝損傷與間質性肺病。", "pages": "34–35", "topic": "fast-ap"}, {"group": "Class III", "name": "Sotalol", "moa": "Racemic β blockade plus IKr blockade|消旋藥兼具 β 阻斷與 IKr 阻斷", "use": "SVT and VT|上心室與心室頻脈", "ae": "Bradycardia; QT prolongation; torsades|心搏過慢、QT 延長、扭轉型心律不整", "caution": "Follow QT and renal-dependent exposure; do not treat as a pure β blocker.|注意 QT 及腎功能影響，非單純 β 阻斷劑。", "pages": "36–37", "topic": "fast-ap"}, {"group": "Class IV", "name": "Verapamil / diltiazem", "moa": "Nodal L-type Ca²⁺ blockade → AV ERP ↑|結細胞 L 型鈣阻斷，AV 不反應期延長", "use": "AV-node-dependent PSVT; rate control contexts|依賴 AV 結的 PSVT、部分心率控制情境", "ae": "Bradycardia; AV block; negative inotropy|心搏過慢、AV 阻斷、負性變力", "caution": "Not DHP drugs; avoid HFrEF / additive AV suppression.|不是 DHP；避免 HFrEF 與加成 AV 抑制。", "pages": "38–39", "topic": "nodal-ap"}, {"group": "A₁ agonists", "name": "Adenosine", "moa": "A₁ / Gi → ICa and If ↓; K⁺ conductance ↑|A₁／Gi 降低 ICa、If，增加鉀通透", "use": "Terminate AV-node-dependent PSVT|終止依賴 AV 結的 PSVT", "ae": "Flushing; chest discomfort; bronchospasm; transient AV block Can induce AF or sinus arrest.|潮紅、胸部不適、支氣管痙攣、短暫 AV 阻斷 也可能誘發 AF 或竇性停搏。", "caution": "Seconds-long action; dipyridamole potentiates, methylxanthines antagonize.|僅數秒；Dipyridamole 增強，甲基黃嘌呤拮抗。", "pages": "42–45", "topic": "adenosine"}, {"group": "Other nodal agents", "name": "Digoxin", "moa": "Lecture: muscarinic agonist / vagal stimulation; diagram shows increased vagal ACh / M₂ signaling → AV conduction ↓.|講義用語：muscarinic agonist／vagal stimulation；圖以增加迷走 ACh／M₂ 訊號、降低 AV 傳導呈現。", "use": "AF with rapid ventricular response|心室反應過快的 AF", "ae": "AV block / arrhythmias; narrow therapeutic margin|AV 阻斷／心律不整，治療範圍窄", "caution": "Separate AV-node action from positive inotropy.|區分 AV 結作用與正性變力機轉。", "pages": "41", "topic": "vagal"}, {"group": "If inhibitors", "name": "Ivabradine", "moa": "HCN / If blockade at SA node|竇房結 HCN／If 阻斷", "use": "Selected sinus-rhythm angina / systolic HF|特定竇性心律的心絞痛／收縮性心衰竭", "ae": "Luminous phenomena; bradycardia|光幻視、心搏過慢", "caution": "Requires sinus rhythm; avoid strong CYP3A4 inhibitors and acute unstable HF.|需竇性心律；避免強 CYP3A4 抑制劑與急性不穩定心衰竭。", "pages": "46–47", "topic": "nodal-ap"}, {"group": "Other agents", "name": "Magnesium", "moa": "Multiple ion-channel / ATPase effects|多種離子通道與 ATPase 作用", "use": "Torsades; digitalis-related arrhythmia contexts|扭轉型及毛地黃相關心律不整情境", "ae": "Not detailed on source slide|來源頁未詳列", "caution": "Do not group with routine class III K⁺ blockade.|不歸為常規 III 類鉀阻斷藥。", "pages": "40, 50", "topic": null}]};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let zh=false,mode='table';const params=new URLSearchParams(location.search);document.body.classList.toggle('embed',params.get('embed')==='1');
function label(s){const [en,cn]=String(s).split('|');return esc(en)+(zh&&cn?'<span class="cnline">'+esc(cn)+'</span>':'')}
function mechanismLink(d){return d.topic?`<a href="${U.id}-mechanisms.html#${d.topic}">↗ Mechanism</a>`:''}
function render(){
 const search=document.querySelector('input');search.hidden=!['table','cards'].includes(mode);const query=search.value.toLowerCase();const ds=U.drugs.filter(d=>Object.values(d).join(' ').toLowerCase().includes(query));let prev='',out='';
 const supp=(U.supplements||[]).find(v=>v.id===mode);
 if(supp){out='<article><h2>'+label(supp.title)+'</h2><p>'+label(supp.note)+'</p><div class="scroll"><table class="supp-table"><thead><tr>'+supp.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+supp.rows.map(row=>'<tr>'+row.map(c=>'<td>'+label(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></article>'}
 else if(!ds.length){out='<p role="status">'+label('No matches|沒有符合的項目')+'</p>'}
 else if(mode==='table'){out='<div class="scroll"><table><thead><tr>'+['Drug / class','Mechanism','Main uses','Adverse effects','Distinctions / cautions'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+ds.map(d=>{const group=d.group!==prev;prev=d.group;return `<tr class="${group?'group':''}"><td>${esc(d.name)}<span class="cnline">${esc(d.group)}</span>${mechanismLink(d)}</td>`+['moa','use','ae','caution'].map(k=>'<td>'+label(d[k])+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>'}
 else{out=ds.map(d=>`<article><h2>${esc(d.name)}</h2><span class="cnline">${esc(d.group)}</span><dl>`+['moa','use','ae','caution'].map((k,i)=>'<dt>'+['Mechanism','Main uses','Adverse effects','Distinctions'][i]+'</dt><dd>'+label(d[k])+'</dd>').join('')+`</dl>${mechanismLink(d)}</article>`).join('')}
 document.querySelector('#results').innerHTML=out;document.querySelector('#zh').textContent=zh?'Hide 中文':'Show 中文';document.querySelector('#zh').setAttribute('aria-pressed',String(zh));document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===mode));
}
const tabs=document.querySelector('[data-mode]').parentElement;for(const t of U.supplements||[]){const b=document.createElement('button');b.dataset.mode=t.id;b.setAttribute('role','tab');b.textContent=t.title.split('|')[0];tabs.append(b)}
document.querySelector('#zh').onclick=()=>{zh=!zh;render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});document.querySelector('input').oninput=render;render();

</script></body></html>
