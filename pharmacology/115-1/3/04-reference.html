ion.|10/27：NO 增加、IP3 鈣釋放減少。11/06：電壓依賴性鉀通道開啟、過極化。仿單：確切機轉未完全明瞭；小動脈作用大於靜脈。 ISDN：經 NO／cGMP 舒張靜脈。", "use": "Selected HF patients; combination outcome evidence|特定心衰竭患者，複方具結局證據", "ae": "Reflex tachycardia; hypotension; nitrate headache; hydralazine lupus|反射心搏加速、低血壓；硝酸酯頭痛、Hydralazine 類狼瘡", "caution": "Nitrates contraindicated with PDE5 inhibitors; molecular hydralazine descriptions differ by lecture. 10/27 lecture: avoid hydralazine in MI / coronary disease, including pregnant patients with coronary disease.|硝酸酯禁與 PDE5 抑制劑併用；Hydralazine 分子說法有課間差異。 10/27 課堂：MI／冠心症避免 Hydralazine，妊娠合併冠心症也不選。", "pages": "11–13", "topic": "preload-afterload"}, {"group": "ACE inhibitors", "name": "Captopril / enalapril / ramipril / lisinopril / fosinopril", "moa": "Ang II ↓ → load and remodeling ↓|Ang II 下降，降低負荷與重塑", "use": "HF; HTN; diabetic nephropathy contexts|心衰竭、高血壓、糖尿病腎病情境", "ae": "Hyperkalemia; hypotension; cough; angioedema|高血鉀、低血壓、乾咳、血管性水腫", "caution": "Renal function / K⁺ monitoring; no pregnancy.|注意腎功能與血鉀；妊娠禁用。", "pages": "15–18", "topic": "neurohormones"}, {"group": "AT₁ blockers", "name": "Losartan / valsartan / telmisartan / irbesartan / olmesartan", "moa": "AT₁ blockade → load and remodeling ↓|AT₁ 阻斷降低負荷與重塑", "use": "Lecture lists HF / HTN / diabetic nephropathy; evidence varies by drug|講義列心衰竭／高血壓／糖尿病腎病，證據依個藥不同", "ae": "Hyperkalemia; hypotension; renal dysfunction|高血鉀、低血壓、腎功能惡化", "caution": "Do not infer all listed ARBs share identical HF outcome evidence.|不可推定所有列名 ARB 具有相同心衰竭結局證據。", "pages": "18", "topic": "neurohormones"}, {"group": "Recombinant BNP", "name": "Nesiritide", "moa": "Receptor guanylyl cyclase → cGMP|受體型 GC 增加 cGMP", "use": "IV acute decompensated HF with dyspnea|靜脈用於急性失代償心衰竭伴呼吸困難", "ae": "Hypotension; creatinine rise|低血壓、肌酸酐上升", "caution": "Hemodynamic effect ≠ established survival benefit.|血流動力改善不等於已證實存活效益。", "pages": "19", "topic": "peptides"}, {"group": "Loop diuretics", "name": "Furosemide / bumetanide / torsemide", "moa": "Loop salt reabsorption ↓|減少環部鹽再吸收", "u cardia; luminous phenomena|心搏過慢、光幻視", "caution": "Lecture: LVEF <35%, HR >70/min on background therapy; not AF rate control.|講義列 LVEF <35%、HR >70 且已有背景治療；不是 AF 心率控制。", "pages": "25–26", "topic": "if-current"}, {"group": "ARNI", "name": "Sacubitril / valsartan", "moa": "Neprilysin inhibition + AT₁ blockade|腦啡肽酶抑制加 AT₁ 阻斷", "use": "Chronic HFrEF; PARADIGM-HF|慢性 HFrEF、PARADIGM-HF", "ae": "Hypotension; hyperkalemia; renal dysfunction; angioedema|低血壓、高血鉀、腎功能惡化、血管性水腫", "caution": "Do not coadminister ACEI; 36-hour separation when switching.|不可與 ACEI 併用；轉換須間隔 36 小時。", "pages": "27–28, 33", "topic": "peptides"}, {"group": "SGLT2 inhibitors", "name": "Dapagliflozin / empagliflozin", "moa": "Proximal SGLT2 inhibition; HF benefits beyond glucose lowering|近端 SGLT2 抑制；心衰竭效益不限降血糖", "use": "HF outcome therapy; lecture guideline / trial figures|心衰竭結局治療，講義指引／試驗圖", "ae": "Genital fungal infection; volume depletion; ketoacidosis risk|生殖器黴菌感染、體液不足、酮酸中毒風險", "caution": "Safety points supplemented by label; not all listed agents have identical HF evidence.|安全性依仿單補充；所有列名藥不一定有相同心衰竭證據。", "pages": "29–34", "topic": "nephron"}, {"group": "SGLT2 inhibitors", "name": "Canagliflozin", "moa": "Proximal SGLT2 inhibition|近端 SGLT2 抑制", "use": "Diabetes drug example on source list|來源列出的糖尿病用藥例子", "ae": "Genital fungal infection; volume depletion; ketoacidosis risk|生殖器黴菌感染、體液不足、酮酸中毒風險", "caution": "Do not infer identical HF approval to dapagliflozin / empagliflozin.|不可推定與 Dapagliflozin／Empagliflozin 有相同 HF 核准。", "pages": "29", "topic": "nephron"}]};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let zh=false,mode='table';const params=new URLSearchParams(location.search);document.body.classList.toggle('embed',params.get('embed')==='1');
function label(s){const [en,cn]=String(s).split('|');return esc(en)+(zh&&cn?'<span class="cnline">'+esc(cn)+'</span>':'')}
function mechanismLink(d){return d.topic?`<a href="${U.id}-mechanisms.html#${d.topic}">↗ Mechanism</a>`:''}
function render(){
 const search=document.querySelector('input');search.hidden=!['table','cards'].includes(mode);const query=search.value.toLowerCase();const ds=U.drugs.filter(d=>Object.values(d).join(' ').toLowerCase().includes(query));let prev='',out='';
 const supp=(U.supplements||[]).find(v=>v.id===mode);
 if(supp){out='<article><h2>'+label(supp.title)+'</h2><p>'+label(supp.note)+'</p><div class="scroll"><table class="supp-table"><thead><tr>'+supp.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+supp.rows.map(row=>'<tr>'+row.map(c=>'<td>'+label(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></article>'}
 else if(!ds.length){out='<p role="status">'+label('No matches|沒有符合的項目')+'</p>'}
 else if(mode==='table'){out='<div class="scroll"><table><thead><tr>'+['Drug / class','Mechanism','Main uses','Adverse effects','Distinctions / cautions'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+ds.map(d=>{const group=d.group!==prev;prev=d.group;return `<tr class="${group?'group':''}"><td>${esc(d.name)}<span class="cnline">${esc(d.group)}</span>${mechanismLink(d)}</td>`+['moa','use','ae','caution'].map(k=>'<td>'+label(d[k])+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>'}
 else{out=ds.map(d=>`<article><h2>${esc(d.name)}</h2><span class="cnline">${esc(d.group)}</span><dl>`+['moa','use','ae','caution'].map((k,i)=>'<dt>'+['Mechanism','Main uses','Adverse effects','Distinctions'][i]+'</dt><dd>'+label(d[k])+'</dd>').join('')+`</dl>${mechanismLink(d)}</article>`).join('')}
 document.querySelector('#results').innerHTML=out;document.querySelector('#zh').textContent=zh?'Hide 中文':'Show 中文';document.querySelector('#zh').setAttribute('aria-pressed',String(zh));document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===mode));
}
const tabs=document.querySelector('[data-mode]').parentElement;for(const t of U.supplements||[]){const b=document.createElement('button');b.dataset.mode=t.id;b.setAttribute('role','tab');b.textContent=t.title.split('|')[0];tabs.append(b)}
document.querySelector('#zh').onclick=()=>{zh=!zh;render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});document.querySelector('input').oninput=render;render();
