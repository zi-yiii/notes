</style></head><body><main><nav class="top"><a href="../../../index.html">⌂</a><a href="index.html">Block 3</a></nav><h1>Drugs for heart failure</h1><div class="tools"><a href="04-reference.html">Drug reference / Compare</a><button id="zh" aria-pressed="false">Show 中文</button></div><div class="tabs" role="tablist" aria-label="Topics" id="topic-tabs"></div><div class="tabs classes" role="tablist" aria-label="Drug classes" id="class-tabs"></div><div class="drawing"><svg class="map" role="img"></svg></div><section class="members" id="members"></section></main><script>const U={"id": "04", "title": "Drugs for heart failure", "cn": "心衰竭治療藥物", "file": "藥-20261106-1-心臟衰竭藥物.pdf", "preview": false, "topics": [{"id": "digoxin", "title": "Na⁺ / Ca²⁺ exchange|鈉鈣交換與收縮", "pages": "4–8", "nodes": [{"id": "pump", "x": 180, "y": 210, "label": "Na⁺ / K⁺ ATPase|鈉鉀幫浦"}, {"id": "gradient", "x": 500, "y": 210, "label": "Na⁺ gradient maintained|維持鈉濃度梯度"}, {"id": "ncx", "x": 820, "y": 210, "label": "Na⁺ / Ca²⁺ exchanger|鈉鈣交換器"}, {"id": "ca", "x": 820, "y": 440, "label": "Ca²⁺ extrusion|鈣離子排出"}, {"id": "vagal", "x": 180, "y": 440, "label": "Vagal tone|迷走神經張力"}, {"id": "av", "x": 500, "y": 440, "label": "AV conduction ↓|房室傳導下降"}], "edges": [{"a": "pump", "b": "gradient", "path": "M300 204H370", "kind": "arrow"}, {"a": "gradient", "b": "ncx", "path": "M635 204H690", "kind": "arrow"}, {"a": "ncx", "b": "ca", "path": "M820 250V403", "kind": "arrow"}, {"a": "vagal", "b": "av", "path": "M275 434H385", "kind": "arrow"}], "opts": [{"label": "Cardiac glycosides|強心配醣體", "target": "pump", "x": 180, "y": 90, "members": ["Digoxin"], "effect": "Na⁺/K⁺ ATPase inhibition → intracellular Na⁺ ↑ → less Ca²⁺ extrusion via NCX → intracellular Ca²⁺ and contractility ↑. Separately, vagal tone ↑ → AV conduction slows.|抑制鈉鉀幫浦 → 胞內鈉上升 → NCX 排鈣減少 → 胞內鈣與收縮力上升；另一條路徑是迷走張力增加 → AV 傳導減慢。", "dim": ["gradient", "ncx", "ca"], "kind": "inhibit", "tip": null, "result": "Intracellular Ca²⁺ ↑ → contractility ↑|胞內鈣增加，收縮力增加"}], "h": 550}, {"id": "camp", "title": "cAMP / inotropy|cAMP 與正性變力", "pages": "9–10", "nodes": [{"id": "b1", "x": 170, "y": 210, "label": "Cardiac β₁ receptor|心臟 β₁ 受體"}, {"id": "camp", "x": 500, "y": 210, "label": "cAMP|環腺苷酸"}, {"id": "ca", "x": 830, "y": 210, "label": "Ca²⁺ / contractility ↑|鈣訊號與收縮力增加"}, {"id": "pde", "x": 500, "y": 440, "label": "PDE3|第三型磷酸二酯酶"}, {"id": "amp", "x": 830, "y": 440, "label": "5′-AMP|失活代謝物"}], "edges": [{"a": "b1", "b": "camp", "path": "M290 204H440", "kind": "arrow"}, {"a": "camp", "b": "ca", "path": "M555 204H695", "kind": "arrow"}, {"a": "camp", "b": "pde", "path": "M500 250V403", "kind": "arrow"}, {"a": "pde", "b": "amp", "path": "M555 434H760", "kind": "arrow"}], "opts": [{"label": "β₁ agonists|β₁ 致效劑", "target": "b1", "x": 170, "y": 90, "members": ["Dobutamine"], "effect": "β₁ → Gs → cAMP / PKA ↑ → cardiac contractility ↑. β₂ signaling contributes vasodilation. Short-term IV support, not chronic β stimulation.|β₁ 經 Gs 增加 cAMP／PKA，增強心肌收縮；β₂ 訊號另促血管舒張。用於短期靜脈支持，不持續刺激慢性心衰竭的 β 受體。", "dim": [], "kind": "promote", "tip": null}, {"label": "PDE3 inhibitors|PDE3 抑制劑", "target": "pde", "x": 500, "y": 555, "members": ["Milrinone"], "effect": "PDE3 inhibition slows cAMP breakdown: cardiac cAMP / PKA ↑ strengthens contraction; vascular smooth-muscle cAMP ↑ promotes relaxation.|抑制 PDE3 減少 cAMP 分解：心肌 cAMP／PKA 上升使收縮增強；血管平滑肌 cAMP 上升則促進舒張。", "dim": ["amp"], "kind": "inhibit", "tip": null}], "h": 630}, {"id": "neurohormones", "title": "RAAS / sympathetic remodeling|神經荷爾蒙與重塑", "pages": "14–18, 21–24", "nodes": [{"id": "sns", "x": 175, "y": 210, "label": "Sympathetic β signaling|交感 β 訊號"}, {"id": "stress", "x": 500, "y": 210, "label": "Chronic adrenergic drive|長期交感驅動"}, {"id": "remodel", "x": 825, "y": 210, "label": "Maladaptive remodeling|不良心室重塑"}, {"id": "ang", "x": 175, "y": 460, "label": "Ang II → AT₁|Ang II 活化 AT₁"}, {"id": "aldo", "x": 500, "y": 460, "label": "Aldosterone → MR|醛固酮活化 MR"}, {"id": "salt", "x": 825, "y": 460, "label": "Retention / fibrosis|鈉水滯留與纖維化"}], "edges": [{"a": "sns", "b": "stress", "path": "M300 204H365", "kind": "arrow"}, {"a": "stress", "b": "remodel", "path": "M635 204H690", "kind": "arrow"}, {"a": "ang", "b": "aldo", "path": "M300 454H365", "kind": "arrow"}, {"a": "aldo", "b": "salt", "path": "M635 454H700", "kind": "arrow"}], "opts": [{"label": "HF β blockers|心衰竭 β 阻斷劑", "target": "sns", "x": 175, "y": 90, "members": ["Metoprolol", "Bisoprolol", "Carvedilol"], "effect": "Acute β stimulation can support output; chronic excessive drive promotes remodeling. In stable HFrEF, start an evidence-based β blocker low and titrate carefully.|急性 β 刺激可暫時支持心輸出；長期交感過度活化會促進重塑。穩定 HFrEF 使用有證據的 β 阻斷劑，從低量開始謹慎調整。", "dim": ["stress", "remodel"], "kind": "inhibit", "tip": null}, {"label": "ACE inhibitors / ARBs|ACE 抑制劑／ARB", "target": "ang", "x": 175, "y": 345, "members": ["Captopril", "Enalapril", "Ramipril", "Lisinopril", "Fosinopril", "Losartan", "Valsartan", "Telmisartan", "Irbesartan", "Olmesartan"], "effect": "ACE inhibitors lower Ang II formation; ARBs block AT₁ (the Ang II type 1 receptor, not Ang I). Both reduce vasoconstriction and maladaptive remodeling. Selected ACEIs / ARBs improve survival in HFrEF.|ACEI 減少 Ang II 生成；ARB 阻斷 AT₁（Ang II 第一型受體，並非 Ang I）。兩者均可減少血管收縮及不良重塑。 有證據的 ACEI／ARB 可改善 HFrEF 存活。", "dim": ["aldo", "salt"], "kind": "inhibit", "tip": null}, {"label": "MR antagonists|礦物皮質素受體拮抗劑", "target": "aldo", "x": 500, "y": 570, "members": ["Spironolactone", "Eplerenone"], "effect": "MR blockade reduces aldosterone-mediated retention and remodeling; monitor K⁺.|MR 阻斷減少醛固酮造成的滯留與重塑，注意血鉀。", "dim": ["salt"], "kind": "inhibit", "tip": null}], "h": 650}, {"id": "peptides", "title": "Natriuretic peptides / ARNI|利鈉胜肽與 ARNI", "pages": "19, 27–28, 33", "nodes": [{"id": "np", "x": 175, "y": 160, "label": "Natriuretic peptides|利鈉胜肽"}, {"id": "gc", "x": 505, "y": 160, "label": "Receptor GC → cGMP|受體型 GC 與 cGMP"}, {"id": "benefit", "x": 825, "y": 160, "label": "Natriuresis / dilation|利鈉與血管擴張"}, {"id": "nep", : 500, "y": 245, "label": "Thick ascending limb|亨利氏環粗上行支"}, {"id": "dct", "x": 830, "y": 245, "label": "Distal tubule|遠端腎小管"}, {"id": "cd", "x": 830, "y": 480, "label": "Collecting duct|集尿管"}, {"id": "retention", "x": 410, "y": 480, "label": "Na⁺ / water reabsorption|鈉與水再吸收"}], "edges": [{"a": "pt", "b": "tal", "path": "M295 239H370", "kind": "arrow"}, {"a": "tal", "b": "dct", "path": "M635 239H725", "kind": "arrow"}, {"a": "dct", "b": "cd", "path": "M830 285V443", "kind": "arrow"}, {"a": "cd", "b": "retention", "path": "M710 474H560", "kind": "arrow"}], "opts": [{"label": "SGLT2 inhibitors|SGLT2 抑制劑", "target": "pt", "x": 170, "y": 115, "members": ["Dapagliflozin", "Empagliflozin", "Canagliflozin"], "effect": "Proximal SGLT2 blockade reduces glucose / Na⁺ reabsorption. HF outcome benefits also occur without diabetes; the full causal mechanism remains unresolved. The lecturer stressed that the heart does not express the renal SGLT2 target; do not infer direct myocardial SGLT2 blockade.|抑制近端小管 SGLT2，減少葡萄糖與鈉再吸收。沒有糖尿病的心衰竭患者也可有結局效益；完整機轉仍未釐清。 老師強調心臟沒有這個腎臟 SGLT2 靶點；不能推論成直接阻斷心肌 SGLT2。", "dim": [], "kind": "inhibit", "tip": null}, {"label": "Loop diuretics|環利尿劑", "target": "tal", "x": 500, "y": 115, "members": ["Furosemide", "Bumetanide", "Torsemide"], "effect": "Loop-site salt reabsorption ↓ → congestion relief; hypokalemia can increase digoxin toxicity.|減少環部鹽再吸收以緩解鬱血；低血鉀可能增加 Digoxin 毒性。", "dim": [], "kind": "inhibit", "tip": null}, {"label": "Thiazide diuretics|噻嗪類利尿劑", "target": "dct", "x": 830, "y": 115, "members": ["Hydrochlorothiazide", "Indapamide"], "effect": "Distal-tubule salt reabsorption ↓ → fluid overload relief.|減少遠端小管鹽再吸收，緩解體液過多。", "dim": [], "kind": "inhibit", "tip": null}, {"label": "MR antagonists|礦物皮質素受體拮抗劑", "target": "cd", "x": 830, "y": 595, "members": ["Spironolactone", "Eplerenone"], "effect": "Blocks aldosterone signaling; K⁺-sparing effect plus remodeling benefit.|阻斷醛固酮訊號，具保鉀作用與抗重塑效益。", "dim": ["retention"], "kind": "inhibit", "tip": null}], "h": 670}, {"id": "if-current", "title": "SA-node If|竇房結 If", "pages": "25–26", "nodes": [], "edges": [], "opts": [{"label": "If inhibitors|If 抑制劑", "target": null, "x": 0, "y": 0, "members": ["Ivabradine"], "effect": "SA-node HCN4 / If inhibition slows phase-4 depolarization and heart rate. Retinal HCN1 helps explain luminous phenomena.|抑制竇房結 HCN4／If，減慢第 4 期去極化與心率；視網膜 HCN1 可解釋光幻視。", "dim": [], "kind": "inhibit", "tip": null, "curveIndex": 2}], "mode": "nodal", "h": 520, "cellTitle": "SA nodal cell|竇房結細胞"}, {"id": "preload-afterload", "title": "Preload / afterload|前負荷與後負荷", "pages": "11–13", "nodes": [{"id": "artery", "x": 175, "y": 210, "label": "Arteriolar tone|小動脈張力"}, {"id": "afterload", "x": 500, "y": 210, "label": "Afterload|後負荷"}, {"id": "work", "x": 825, "y": 210, "label": "Cardiac work|心臟做功"}, {"id": "vein", "x": 175, "y": 460, "label": "Venous tone|靜脈張力"}, {"id": "preload", "x": 500, "y": 460, "label": "Preload|前負荷"}, {"id": "wall", "x": 825, "y": 460, "label": "Wall tension|心室壁張力"}], "edges": [{"a": "artery", "b": "afterload", "path": "M280 204H415", "kind": "arrow"}, {"a": "afterload", "b": "work", "path": "M585 204H725", "kind": "arrow"}, {"a": "vein", "b": "preload", "path": "M270 454H415", "kind": "arrow"}, {"a": "preload", "b": "wall", "path": "M585 454H730", "kind": "arrow"}], "opts": [{"label": "Arterial / venous dilators|動脈與靜脈擴張劑", "target": "artery", "x": 175, "y": 95, "members": ["Hydralazine", "Isosorbide dinitrate", "Isosorbide mononitrate"], "effect": "Hydralazine mainly lowers afterload; nitrates mainly lower preload. Combination can unload both sides.|Hydralazine 主要降低後負荷；硝酸酯主要降低前負荷，合用可降低兩種負荷。", "dim": ["afterload", "work", "preload", "wall"], "kind": "inhibit", "tip": null, "actionLabel": "Hydralazine|小動脈擴張", "extra": [{"target": "vein", "x": 175, "y": 580, "kind": "inhibit", "label": "Nitrates|靜脈擴張"}]}], "h": 670}], "drugs": [{"group": "Cardiac glycosides", "name": "Digoxin", "moa": "Na⁺/K⁺ ATPase ↓ → NCX Ca²⁺ extrusion ↓; vagal AV slowing|抑制鈉鉀幫浦、減少 NCX 排鈣；另減慢 AV 傳導", "use": "HF symptom support; ventricular rate control in AF via slower AV conduction.|心衰竭症狀支持；減慢 AV 傳導以控制 AF 的心室率。", "ae": "Anorexia, nausea, vomiting; AV block; Ca²⁺ overload → delayed afterdepolarizations (DADs) → ventricular arrhythmias; blurred or altered color vision. Yellow / green / blue visual changes; seizures in severe toxicity. Rare gynecomastia (lecture: estrogenic activity).|厭食、噁心、嘔吐；AV 阻斷；鈣超載 → 延遲後去極化（DAD）→ 心室心律不整；視力模糊或色覺改變。 黃／綠／藍色視覺異常；嚴重中毒可癲癇發作。少見男性女乳（講義：雌激素樣作用）。", "caution": "Low K⁺ (e.g., loop diuretics) increases toxicity. Renal impairment and quinidine / diltiazem / verapamil can raise exposure. Antacids / cholestyramine can reduce oral absorption. Digoxin immune Fab for severe toxicity. Narrow therapeutic window; lecture gives 0.5–2 ng/mL (not a universal HF target). Older age and impaired renal function increase risk.|低血鉀（如環利尿劑所致）增加毒性；腎功能下降及 Quinidine／Diltiazem／Verapamil 可增加暴露；制酸劑／Cholestyramine 可降低口服吸收。嚴重中毒用 Digoxin immune Fab。 治療範圍窄；講義列 0.5–2 ng/mL（非所有心衰竭患者的通用目標）。高齡及腎功能下降增加風險。", "pages": "4–8", "topic": "digoxin"}, {"group": "β₁ agonists", "name": "Dobutamine", "moa": "β₁ → cardiac cAMP ↑; β₂ contributes dilation|β₁ 增加心肌 cAMP；β₂ 另有擴張作用", "use": "Short-term acute HF support (IV)|急性心衰竭短期靜脈支持", "ae": "Tachyarrhythmias; excessive vasoconstriction|快速心律不整、過度血管收縮", "caution": "Lecture contrasts brief acute IV support with prolonged β stimulation, which can worsen outcomes; not a chronic survival treatment.|老師對比急性短期靜脈支持與持續 β 刺激；長期使用可能使結局惡化，非慢性存活治療。", "pages": "9", "topic": "camp"}, {"group": "PDE3 inhibitors", "name": "Milrinone", "moa": "cAMP breakdown ↓ → inotropy and vasodilation|減少 cAMP 分解、正性變力兼血管擴張", "use": "Short-term HF management (IV)|心衰竭短期靜脈治療", "ae": "Tachyarrhythmia; hypotension; thrombocytopenia|快速心律不整、低血壓、血小板低下", "caution": "Renal elimination; prolonged use can increase mortality. Prolonged use: thrombocytopenia, ventricular arrhythmias and mortality risk. Lecture exception: specialist bridge to transplant in infants (slide: up to 6 months; oral lecture: sometimes longer). Not a general duration recommendation.|腎排除；長期使用可能增加死亡。 長期使用：血小板低下、心室心律不整及死亡風險。課堂例外：嬰兒等待移植時由專科作橋接（講義寫最長 6 個月；口述提到有時更久），非一般療程建議。", "pages": "10", "topic": "camp"}, {"group": "Vasodilators", "name": "Hydralazine / isosorbide dinitrate", "moa": "Hydralazine relaxes arterioles → afterload ↓, the focus of the HF lecture. 10/27: NO ↑ / IP3-mediated Ca²⁺ release ↓. 11/06: voltage-gated K⁺ opening → hyperpolarization. Label: precise mechanism not fully defined; arterioles > veins. ISDN: NO / cGMP-mediated venodilation.|Hydralazine 舒張小動脈 → 後負荷下降，是心衰竭課的重點。 10/27：NO 增加、IP3 鈣釋放減少。11/06：電壓依賴性鉀通道開啟、過極化。仿單：確切機轉未完全明瞭；小動脈作用大於靜脈。 ISDN：經 NO／cGMP 舒張靜脈。", "use": "Selected HF patients; combination outcome evidence|特定心衰竭患者，複方具結局證據", "ae": "Reflex tachycardia; hypotension; nitrate headache; hydralazine lupus Hydralazine can also cause fluid retention via increased renin (slide p.13).|反射心搏加速、低血壓；硝酸酯頭痛、Hydralazine 類狼瘡 Hydralazine 也可能經腎素增加引起體液滯留（講義第 13 頁）。", "caution": "Nitrates contraindicated with PDE5 inhibitors; molecular hydralazine descriptions differ by lecture. 10/27 lecture: avoid hydralazine in MI / coronary disease, including pregnant patients with coronary disease. Slide p.13 notes that β blockers with substantial first-pass metabolism can increase hydralazine bioavailability, potentially requiring dose reduction.|硝酸酯禁與 PDE5 抑制劑併用；Hydralazine 分子說法有課間差異。 10/27 課堂：MI／冠心症避免 Hydralazine，妊娠合併冠心症也不選。 講義第 13 頁提到首渡代謝明顯的 β 阻斷劑可提高 Hydralazine 生體可用率，可能需減量。", "pages": "11–13", "topic": "preload-afterload"}, {"group": "ACE inhibitors", "name": "Captopril / enalapril / ramipril / lisinopril / fosinopril", "moa": "Ang II ↓ → load and remodeling ↓ Bradykinin breakdown ↓ explains dry cough; ARBs do not directly inhibit ACE.|Ang II 下降，降低負荷與重塑 Bradykinin 分解減少可解釋乾咳；ARB 不直接抑制 ACE。", "use": "Standard HFrEF therapy when appropriate; selected agents have survival benefit. ACEI or ARB is an alternative when ARNI is not used.|合適的 HFrEF 患者之標準治療；有研究支持的個藥具存活效益。未使用 ARNI 時，可採 ACEI 或 ARB。", "ae": "Hyperkalemia; hypotension; cough; angioedema|高血鉀、低血壓、乾咳、血管性水腫", "caution": "Renal function / K⁺ monitoring; no pregnancy. Lecture PK: mainly renal elimination; fosinopril has roughly equal renal and fecal routes.|注意腎功能與血鉀；妊娠禁用。 講義藥動：多以腎排除；Fosinopril 腎、糞排除約各半。", "pages": "15–18", "topic": "neurohormones"}, {"group": "AT₁ blockers", "name": "Losartan / valsartan / telmisartan / irbesartan / olmesartan", "moa": "AT₁ blockade → load and remodeling ↓|AT₁ 阻斷降低負荷與重塑", "use": "Standard HFrEF therapy when appropriate; selected agents have survival benefit. ACEI or ARB is an alternative when ARNI is not used.|合適的 HFrEF 患者之標準治療；有研究支持的個藥具存活效益。未使用 ARNI 時，可採 ACEI 或 ARB。", "ae": "Hyperkalemia; hypotension; renal dysfunction|高血鉀、低血壓、腎功能惡化", "caution": "Do not infer all listed ARBs share identical HF outcome evidence. Lecture PK: largely hepatic metabolism / fecal elimination; individual agents differ.|不可推定所有列名 ARB 具有相同心衰竭結局證據。 講義藥動：多經肝代謝、糞便排出；個藥有差異。", "pages": "18", "topic": "neurohormones"}, {"group": "Recombinant BNP", "name": "Nesiritide", "moa": "Receptor guanylyl cyclase → cGMP|受體型 GC 增加 cGMP", "use": "IV acute decompensated HF with dyspnea|靜脈用於急性失代償心衰竭伴呼吸困難", "ae": "Hypotension; creatinine rise|低血壓、肌酸酐上升", "caution": "Supplement: hemodynamic improvement does not establish a survival benefit.|補充：血流動力改善不等於已證實存活效益。", "pages": "19", "topic": "peptides"}, {"group": "Loop diuretics", "name": "Furosemide / bumetanide / torsemide", "moa": "Loop salt reabsorption ↓|減少環部鹽再吸收", "use": "Congestion / edema / dyspnea relief|緩解鬱血、水腫、呼吸困難", "ae": "Hypokalemia; volume depletion|低血鉀、體液不足", "caution": "Low K⁺ potentiates digoxin arrhythmias.|低血鉀增強 Digoxin 心律不整風險。", "pages": "20", "topic": "nephron"}, {"group": "Thiazide diuretics", "name": "Hydrochlorothiazide / indapamide", "moa": "Distal tubular salt reabsorption ↓|減少遠端小管鹽再吸收", "use": "Volume overload relief|緩解體液過多", "ae": "Individual adverse effects not detailed on this slide|此頁未詳列個別不良反應", "caution": "Symptom relief is distinct from mortality evidence.|症狀緩解與死亡率證據不同。", "pages": "20", "topic": "nephron"}, {"group": "MR antagonists", "name": "Spironolactone", "moa": "MR blockade; K⁺ sparing / anti-remodeling|MR 阻斷、保鉀與抗重塑", "use": "Additional HFrEF survival benefit (RALES)|HFrEF 額外存活效益，RALES", "ae": "Hyperkalemia; gynecomastia; impotence|高血鉀、男性女乳、性功能障礙", "caution": "Risk rises with renal impairment / ACEI.|腎功能不全或併用 ACEI 時高血鉀風險增加。", "pages": "22", "topic": "neurohormones"}, {"group": "MR antagonists", "name": "Eplerenone", "moa": "More selective MR blockade|較選擇性 MR 阻斷", "use": "HF outcome benefit (EPHESUS)|心衰竭結局效益，EPHESUS", "ae": "Hyperkalemia; fewer endocrine effects than spironolactone|高血鉀；內分泌作用較 Spironolactone 少", "caution": "Less endocrine toxicity does not mean no K⁺ risk. Lecture example: start with lower-cost spironolactone when appropriate; consider eplerenone if gynecomastia occurs. Slide describes endocrine adverse effects as about tenfold less frequent.|較少內分泌毒性不代表沒有高血鉀。 課堂例子：合適時可先用較便宜的 Spironolactone；若有男性女乳可考慮 Eplerenone。講義列內分泌副作用頻率約低十倍。", "pages": "22", "topic": "neurohormones"}, {"group": "HF β blockers", "name": "Metoprolol / bisoprolol / carvedilol", "moa": "Limits chronic sympathetic remodeling Lecture: less hypertrophy, apoptosis and inflammatory signaling; β-receptor upregulation and lower oxygen demand. Carvedilol blocks β₁/β₂/α₁ and has antioxidant effects.|減少長期交感相關重塑 講義：減少肥大、凋亡與發炎訊號、上調 β 受體並降低耗氧。Carvedilol 阻斷 β₁／β₂／α₁，亦具抗氧化作用。", "use": "Stable chronic systolic HF with careful titration|穩定慢性收縮性心衰竭，謹慎調整", "ae": "Bradycardia; hypotension; initial HF worsening; bronchoconstriction Also erectile dysfunction.|心搏過慢、低血壓、初期惡化、支氣管收縮 另有勃起功能障礙。", "caution": "In stable HFrEF, start low and titrate; abrupt high-dose initiation can worsen HF. Evidence depends on agent and formulation (e.g., metoprolol succinate).|穩定 HFrEF 低量起始並逐步調整；一下子給高量可能惡化。證據依個藥與劑型而異，例如 metoprolol succinate。", "pages": "24", "topic": "neurohormones"}, {"group": "If inhibitors", "name": "Ivabradine", "moa": "SA-node If inhibition → HR ↓|抑制竇房結 If、降低心率", "use": "Stable symptomatic systolic HF in sinus rhythm with elevated HR SHIFT: fewer HF admissions and HF deaths (the latter a secondary endpoint).|穩定有症狀收縮性心衰竭、竇性心律且心率高 SHIFT：心衰竭住院與心衰竭死亡下降；後者為次要終點。", "ae": "Bradycardia; luminous phenomena associated with retinal HCN1 inhibition.|心搏過慢；與視網膜 HCN1 抑制相關的光幻視。", "caution": "Lecture: LVEF <35% and HR >70/min despite background therapy. U.S. label uses ≤35% and resting HR ≥70/min in sinus rhythm. Overall cardiovascular death did not fall significantly in SHIFT. Metabolized via CYP3A4.|課堂：LVEF <35%、背景治療後 HR >70/min。美國仿單為 LVEF ≤35%、竇性心律且靜息 HR ≥70/min。SHIFT 的整體心血管死亡未達顯著下降。經 CYP3A4 代謝。", "pages": "25–26", "topic": "if-current"}, {"group": "ARNI", "name": "Sacubitril / valsartan", "moa": "Neprilysin inhibition + AT₁ blockade|腦啡肽酶抑制加 AT₁ 阻斷", "use": "Chronic HFrEF; PARADIGM-HF|慢性 HFrEF、PARADIGM-HF", "ae": "Hypotension; hyperkalemia; renal dysfunction; angioedema|低血壓、高血鉀、腎功能惡化、血管性水腫", "caution": "Do not combine with ACEIs or another ARB. Allow 36 hours between ACEI and ARNI. PARADIGM-HF compared with enalapril.|不與 ACEI 或另一種 ARB 併用；ACEI 與 ARNI 轉換需間隔 36 小時。PARADIGM-HF 對照藥為 Enalapril。", "pages": "27–28, 33", "topic": "peptides"}, {"group": "SGLT2 inhibitors", "name": "Dapagliflozin / empagliflozin", "moa": "Proximal SGLT2 inhibition; HF benefits beyond glucose lowering Slide p.29 also lists improved insulin sensitivity and β-cell secretion and reduced gluconeogenesis; these are not established explanations for HF benefit.|近端 SGLT2 抑制；心衰竭效益不限降血糖 講義第 29 頁另列胰島素敏感性及 β 細胞分泌改善、糖質新生減少；不能以此當成已證實的心衰竭效益機轉。", "use": "HF outcome therapy, including patients without diabetes; evidence is agent- and population-specific. Lecture traces the observation to cardiovascular safety trials, e.g. EMPA-REG OUTCOME, followed by HF trials.|心衰竭結局治療，也涵蓋無糖尿病者；證據依個藥及族群。 老師以 EMPA-REG OUTCOME 等心血管安全試驗說明這個發現，之後才有專門的心衰竭試驗。", "ae": "Genital fungal infection; volume depletion; ketoacidosis risk|生殖器黴菌感染、體液不足、酮酸中毒風險", "caution": "Safety points supplemented by label; not all listed agents have identical HF evidence.|安全性依仿單補充；所有列名藥不一定有相同心衰竭證據。", "pages": "29–34", "topic": "nephron"}, {"group": "SGLT2 inhibitors", "name": "Canagliflozin", "moa": "Proximal SGLT2 inhibition|近端 SGLT2 抑制", "use": "SGLT2 inhibitor listed on lecture slide p.29.|講義第 29 頁列名的 SGLT2 抑制劑。", "ae": "Genital fungal infection; volume depletion; ketoacidosis risk|生殖器黴菌感染、體液不足、酮酸中毒風險", "caution": "Do not infer identical HF approval to dapagliflozin / empagliflozin.|不可推定與 Dapagliflozin／Empagliflozin 有相同 HF 核准。", "pages": "29", "topic": "nephron"}], "supplements": [{"id": "treatment-roles", "title": "Treatment roles|治療角色", "note": "11/06 lecture: separate the four HFrEF pillars from decongestion and short-term inotropic support.|11/06 課堂：區分 HFrEF 四本柱、解除鬱血與短期強心支持。", "headers": ["Role", "Drug class / examples", "What to remember"], "rows": [["Pillar 1 · RAAS pathway|第一柱：RAAS", "ARNI or ACEI / ARB|ARNI 或 ACEI／ARB", "One pathway choice. ARNI already contains valsartan; do not stack ACEI or another ARB.|同一治療柱擇一；ARNI 已含 Valsartan，不再疊加 ACEI 或其他 ARB。"], ["Pillar 2 · β blockade|第二柱：β 阻斷", "Metoprolol / bisoprolol / carvedilol. Formulation note: metoprolol succinate.|Metoprolol／Bisoprolol／Carvedilol。劑型補充：metoprolol succinate。", "Stable chronic HFrEF: start low, titrate; limit chronic adrenergic injury.|穩定慢性 HFrEF 低量起始、逐步調整，減少長期交感傷害。"], ["Pillar 3 · MRA|第三柱：MRA", "Spironolactone / eplerenone", "Less aldosterone-driven remodeling; K⁺ can rise. Eplerenone has fewer endocrine effects.|減少醛固酮相關重塑；血鉀可能上升。Eplerenone 的內分泌作用較少。"], ["Pillar 4 · SGLT2 inhibition|第四柱：SGLT2 抑制", "Dapagliflozin / empagliflozin", "Outcome benefits are not limited to diabetes. Renal target is established; full HF mechanism is unresolved.|效益不限於糖尿病。腎臟靶點已知，心衰竭完整機轉未明。"], ["Decongestion|解除鬱血", "Loop diuretics|環利尿劑", "Relieves edema and dyspnea; K⁺ loss can raise digoxin toxicity risk.|改善水腫、喘；鉀流失可能增加 Digoxin 毒性。"], ["Short-term inotropy|短期強心", "IV dobutamine / milrinone|靜脈 Dobutamine／Milrinone", "Supports output in selected acute settings. Chronic β blockade and acute β stimulation have different aims.|特定急性情境支持心輸出；慢性 β 阻斷與急性 β 刺激的目的不同。"]]}, {"id": "digoxin-review", "title": "Digoxin: effect and toxicity|Digoxin：藥效與毒性", "note": "The lecturer explicitly flagged low K⁺ and interactions as exam points.|老師明示低血鉀及交互作用是考點。", "headers": ["Clue", "Mechanism / significance"], "rows": [["Low K⁺ + digoxin|低血鉀＋Digoxin", "Loop diuretic → K⁺ loss → increased sensitivity to digoxin and greater toxicity risk. Lecture connects this to stronger net Na⁺/K⁺ ATPase inhibition.|環利尿劑 → 鉀流失 → 對 Digoxin 更敏感、毒性風險上升。課堂以鈉鉀幫浦淨抑制加強解釋。"], ["Drug effect on ECG|用藥心電圖變化", "PR prolongation, shortened QT (shorter APD), and scooped ST depression can occur during therapeutic use; these changes alone do not diagnose toxicity.|治療用藥可見 PR 延長、QT 縮短（APD 縮短）及下凹型 ST 壓低；單憑這些變化不能診斷中毒。"], ["Slow rhythm vs ventricular ectopy|慢心律與心室異位搏動", "AV block (e.g., 2:1); Ca²⁺ overload → DAD → PVCs and potentially VT / VF.|AV 阻斷（如 2:1）；鈣超載 → DAD → PVC，嚴重可 VT／VF。"], ["Increased exposure|暴露上升", "Renal impairment; quinidine, diltiazem or verapamil can increase digoxin exposure. Antacids and cholestyramine instead reduce oral absorption.|腎功能下降、Quinidine／Diltiazem／Verapamil 可增加 Digoxin 暴露；制酸劑與 Cholestyramine 則降低口服吸收。"], ["Severe toxicity|嚴重中毒", "Digoxin immune Fab binds digoxin.|Digoxin immune Fab 結合 Digoxin。"]]}]};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pair=s=>String(s||'').split('|');let zh=false,selected=0,choice=0;const choices=U.topics.map(()=>0);const params=new URLSearchParams(location.search);document.body.classList.toggle('embed',params.get('embed')==='1');
function label(s){const [en,cn]=pair(s);return esc(en)+(zh&&cn?'<span class="cnline">'+esc(cn)+'</span>':'')}
function txt(x,y,s,cls='',anchor='middle'){const [en,cn]=pair(s);return `<text class="${cls}" x="${x}" y="${y}" text-anchor="${anchor}">${esc(en)}</text>`+(zh&&cn?`<text class="cn ${cls}" x="${x}" y="${y+23}" text-anchor="${anchor}">${esc(cn)}</text>`:'')}
// Terminal shapes are drawn on each path. No duplicated marker IDs across tabs.
function capPath(d,kind,color){return `<path class="edge" d="${d}" ${kind==='none'?'':'data-cap="'+kind+'"'} style="stroke:${color}"/>`}
function centerBadges(svg){svg.querySelectorAll('g.action').forEach(g=>{const r=g.querySelector('rect.badge'),ts=[...g.querySelectorAll('text')];if(!r||!ts.length)return;const boxes=ts.map(t=>t.getBBox()),top=Math.min(...boxes.map(b=>b.y)),bottom=Math.max(...boxes.map(b=>b.y+b.height)),dy=Number(r.getAttribute('y'))+Number(r.getAttribute('height'))/2-(top+bottom)/2;ts.forEach(t=>t.setAttribute('y',Number(t.getAttribute('y'))+dy));})}
function annotate(svg){svg.querySelectorAll('[data-cap]').forEach(p=>{let l=p.getTotalLength();if(l<1)return;const end=p.getPointAtLength(l),prev=p.getPointAtLength(l-.5);let dx=end.x-prev.x,dy=end.y-prev.y,z=Math.hypot(dx,dy);dx/=z;dy/=z;const q=document.createElementNS('http://www.w3.org/2000/svg','path'),bar=p.dataset.cap==='bar';q.setAttribute('d',bar?`M${end.x-dy*7} ${end.y+dx*7}L${end.x+dy*7} ${end.y-dx*7}`:`M${end.x} ${end.y}L${end.x-dx*8-dy*3.6} ${end.y-dy*8+dx*3.6}L${end.x-dx*8+dy*3.6} ${end.y-dy*8-dx*3.6}Z`);q.setAttribute('fill',bar?'none':p.style.stroke);q.setAttribute('stroke',p.style.stroke);q.setAttribute('stroke-width',bar?'1.8':'0');p.parentElement.append(q)})}
function action(a,nodes){if(!a.target)return '';const t=nodes.find(n=>n.id===a.target),promote=a.kind==='promote',color=promote?'#41856e':'#b34d64',below=a.y>t.y;let start=below?a.y-26:a.y+(zh?48:30),end=below?t.y+43:t.y-21;const lab=a.actionLabel||a.label;const width=Math.max(140,Math.min(305,pair(lab)[0].length*8+30));return `<g class="action"><rect class="badge" x="${a.x-width/2}" y="${a.y-20}" width="${width}" height="${zh?57:38}" rx="4"/>`+txt(a.x,a.y,lab,'drug-label')+capPath(`M${a.x} ${start}V${end}`,promote?'arrow':'bar',color)+'</g>'}
function graph(t,a){let s='';if(t.mode)return ap(t,a);const dims=new Set(a?.dim||[]);t.edges.forEach(ed=>{const dim=dims.has(ed.a)||dims.has(ed.b);s+=`<g class="${dim?'dim':''}">`+capPath(ed.path,ed.kind,'#7892a2')+'</g>'});t.nodes.forEach(nd=>s+=`<g class="node ${dims.has(nd.id)?'dim':''}" data-id="${nd.id}">`+txt(nd.x,nd.y,nd.label)+'</g>');if(a){if(a.result)s+=txt(500,610,a.result,'note');s+=action(a,t.nodes);(a.extra||[]).forEach(x=>s+=action(x,t.nodes))}return s}
function ap(t,a){let s='';const fast=t.mode==='fast',idx=a?(a.curveIndex??t.opts.indexOf(a)):-1;s+=txt(120,60,fast?'Ventricular myocyte|心室肌細胞':(t.cellTitle||'SA / AV nodal cell|竇房結／房室結細胞'),'note','start');s+='<path class="axis" d="M140 120V390H875"/>';s+=txt(100,140,'mV','note');s+=txt(850,425,'Time|時間','note');let normal,changed,caption;
if(fast){normal='M150 365H250L260 145L300 173Q380 165 480 210Q535 250 560 365H855';const paths=['M150 365H250L285 155L330 175Q420 165 540 210Q605 255 635 365H855','M150 365H250L263 150L295 177Q350 180 410 225Q460 280 480 365H855','M150 365H250L330 145L365 173Q430 175 480 210Q535 255 560 365H855','M150 365H250L260 145L300 173Q430 165 565 210Q650 260 675 365H855'];changed=paths[idx];s+=txt(245,105,'0 · INa|第 0 期，鈉流入','note');s+=txt(400,135,'2 · ICa|第 2 期，鈣流入','note');s+=txt(780,265,'3 · IK|第 3 期，鉀外流','note');caption=['Na⁺ block + K⁺ block: QRS ↑ / APD ↑|鈉阻斷加鉀阻斷：QRS 變寬、APD 延長','Fast recovery: APD ↓|恢復快速：APD 縮短','Strong conduction slowing: QRS ↑↑; APD ≈|強烈減慢傳導：QRS 明顯變寬，APD 約不變','K⁺ block: APD / ERP / QT ↑|鉀阻斷：APD／ERP／QT 延長'][idx];
}else{normal='M150 365Q240 330 330 280Q355 150 385 155Q445 165 480 365Q575 330 665 280Q690 150 720 155Q780 165 815 365';changed=idx===1?'M150 365Q240 330 330 280Q385 220 420 210Q465 240 500 365Q595 330 685 280Q735 220 770 210Q815 240 850 365':'M150 365Q310 335 470 280Q495 150 525 155Q585 165 620 365Q700 348 855 305';s+=txt(270,235,'4 · If / ICa|第 4 期，自發去極化','note');s+=txt(530,120,'0 · ICa,L|第 0 期，L 型鈣流入','note');caption=['β blockade: cAMP / automaticity ↓|β 阻斷：cAMP 與自發性下降','Ca²⁺ block: nodal upstroke / conduction ↓|鈣阻斷：結細胞上升相與傳導減慢','If blockade: phase-4 slope ↓|If 阻斷：第 4 期斜率下降'][idx]}
s+=`<path class="baseline" style="${a?'opacity:.3;stroke-dasharray:6 5':''}" d="${normal}"/>`;if(a){s+=`<path class="changed" d="${changed}"/>`;s+=txt(505,470,caption,'note')}else s+=txt(505,470,'Normal physiology · schematic, not a measured trace|正常生理示意，非實測波形','note');return s}
function reserveTabs(){const nav=document.querySelector('#class-tabs'),probe=document.createElement('div');probe.className='tabs classes';probe.style.cssText='position:absolute;visibility:hidden;pointer-events:none;width:'+nav.clientWidth+'px';document.querySelector('main').append(probe);let max=0;for(const t of U.topics){probe.innerHTML=[null,...t.opts].map(v=>'<button style="font-weight:600">'+esc(v?pair(v.label)[0]:'Normal physiology')+'</button>').join('');max=Math.max(max,probe.getBoundingClientRect().height)}probe.remove();nav.style.minHeight=max+'px'}
addEventListener('resize',reserveTabs);document.fonts.ready.then(reserveTabs);
function selectTopic(i,write=true){selected=i;choice=choices[i];if(write)history.replaceState(null,'','#'+U.topics[i].id);render()}
function render(){const t=U.topics[selected],a=choice?t.opts[choice-1]:null;document.querySelector('#topic-tabs').innerHTML=U.topics.map((v,i)=>`<button role="tab" aria-selected="${selected===i}" tabindex="${selected===i?0:-1}" data-topic="${i}">${esc(pair(v.title)[0])}</button>`).join('');document.querySelector('#class-tabs').innerHTML=[null,...t.opts].map((v,i)=>`<button role="tab" aria-selected="${choice===i}" tabindex="${choice===i?0:-1}" data-choice="${i}">${esc(v?pair(v.label)[0]:'Normal physiology')}</button>`).join('');const svg=document.querySelector('svg');svg.setAttribute('viewBox',`0 0 1000 ${Math.max(...U.topics.map(v=>v.h||600))}`);svg.innerHTML=graph(t,a);svg.setAttribute('aria-label',pair(t.title)[0]+' — '+(a?pair(a.label)[0]:'Normal physiology'));centerBadges(svg);annotate(svg);document.querySelector('#members').innerHTML=a?`<h2>${label(a.label)}</h2><p>${label(a.effect)}</p><ul>${a.members.map(v=>'<li>'+esc(v)+'</li>').join('')}</ul>`:`<h2>${label('Normal physiology|正常生理')}</h2>`;document.querySelector('#zh').textContent=zh?'Hide 中文':'Show 中文';document.querySelector('#zh').setAttribute('aria-pressed',String(zh));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>selectTopic(+b.dataset.topic));document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=+b.dataset.choice;choices[selected]=choice;render()})}
document.querySelector('#zh').onclick=()=>{zh=!zh;render()};function fromHash(){const i=U.topics.findIndex(v=>v.id===location.hash.slice(1));selectTopic(Math.max(i,0),false)}addEventListener('hashchange',fromHash);for(const id of ['topic-tabs','class-tabs'])document.getElementById(id).addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const list=[...e.currentTarget.querySelectorAll('button')],j=list.indexOf(document.activeElement),k=e.key==='Home'?0:e.key==='End'?list.length-1:(j+(e.key==='ArrowRight'?1:-1)+list.length)%list.length;list[k].click();e.currentTarget.querySelectorAll('button')[k].focus()});fromHash();reserveTabs();
