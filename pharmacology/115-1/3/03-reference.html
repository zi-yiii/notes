id": "if", "x": 170, "y": 450, "label": "SA-node If|竇房結 If"}, {"id": "hr", "x": 500, "y": 450, "label": "Heart rate|心率"}, {"id": "demand", "x": 830, "y": 450, "label": "O₂ demand|心肌耗氧"}], "edges": [{"a": "na", "b": "overload", "path": "M285 204H370", "kind": "arrow"}, {"a": "overload", "b": "tension", "path": "M630 204H705", "kind": "arrow"}, {"a": "if", "b": "hr", "path": "M265 444H425", "kind": "arrow"}, {"a": "hr", "b": "demand", "path": "M575 444H730", "kind": "arrow"}], "opts": [{"label": "Late INa inhibitors|晚期鈉電流抑制劑", "target": "na", "x": 170, "y": 95, "members": ["Ranolazine"], "effect": "Reduces late Na⁺ influx and Ca²⁺ overload → diastolic tension ↓; QT can still prolong.|減少晚期鈉流入及鈣負荷，降低舒張壁張力；仍可能延長 QT。", "dim": ["overload", "tension"], "kind": "inhibit", "tip": null}, {"label": "If inhibitors|If 抑制劑", "target": "if", "x": 170, "y": 335, "members": ["Ivabradine"], "effect": "Slows SA-node firing; needs sinus rhythm.|減慢竇房結放電，需竇性心律。", "dim": ["hr", "demand"], "kind": "inhibit", "tip": null}], "h": 550}, {"id": "thrombosis", "title": "Plaque / platelet / clot|斑塊、血小板與凝血", "pages": "7–8, 40–41", "nodes": [{"id": "cox", "x": 180, "y": 190, "label": "Platelet COX → TXA₂|血小板 COX 生成 TXA₂"}, {"id": "p2y", "x": 180, "y": 430, "label": "ADP → P2Y₁₂|ADP 活化 P2Y₁₂"}, {"id": "activation", "x": 500, "y": 310, "label": "Platelet activation|血小板活化"}, {"id": "gpii", "x": 820, "y": 310, "label": "GP IIb/IIIa|纖維蛋白原結合受體"}, {"id": "aggregate", "x": 820, "y": 560, "label": "Platelet aggregation|血小板聚集"}], "edges": [{"a": "cox", "b": "join", "path": "M315 184H365V304", "kind": "none"}, {"a": "p2y", "b": "join", "path": "M295 424H365V304", "kind": "none"}, {"a": "join", "b": "activation", "path": "M365 304H390", "kind": "arrow"}, {"a": "activation", "b": "gpii", "path": "M615 304H745", "kind": "arrow"}, {"a": "gpii", "b": "aggregate", "path": "M820 350V524", "kind": "arrow"}], "opts": [{"label": "COX inhibitors|COX 抑制劑", "target": "cox", "x": 180, "y": 75, "members": ["Aspirin"], "effect": "Platelet COX inhibition → TXA₂ ↓ → aggregation ↓.|抑制血小板 COX，減少 TXA₂ 與聚集。", "dim": ["activation", "gpii", "aggregate"], "kind": "inhibit", "tip": null}, {"label": "P2Y₁₂ antagonists|P2Y₁₂ 拮抗劑", "target": "p2y", "x": 180, "y": 550, "members": ["Clopidogrel", "Ticagrelor"], "effect": "Blocks ADP-mediated P2Y₁₂ activation.|阻斷 ADP 經 P2Y₁₂ 活化血小板。", "dim": ["activation", "gpii", "aggregate"], "kind": "inhibit", "tip": null}, {"label": "GP IIb/IIIa antagonists|GP IIb/IIIa 拮抗劑", "target": "gpii", "x": 820, "y": 190, "members": ["Abciximab"], "effect": "Prevents fibrinogen-mediated platelet bridging.|阻斷纖維蛋白原橋接血小板。", "dim": ["aggregate"], "kind": "inhibit", "tip": null}], "h": 640}, {"id": "coagulation", "title": "Coagulation|凝血", "pages": "7–8, 40", "nodes": [{"id": "coag", "x": 160, "y": 230, "label": "Coagulation cascade|凝血級聯"}, {"id": "factors", "x": 500, "y": 230, "label": "Factor Xa / thrombin|第 Xa 因子與凝血酶"}, {"id": "fibrin", "x": 835, "y": 230, "label": "Fibrin formation|纖維蛋白形成"}], "edges": [{"a": "coag", "b": "factors", "path": "M290 224H365", "kind": "arrow"}, {"a": "factors", "b": "fibrin", "path": "M640 224H720", "kind": "arrow"}], "opts": [{"label": "Anticoagulants|抗凝血藥", "target": "factors", "x": 500, "y": 110, "members": ["Heparin", "Enoxaparin"], "effect": "Antithrombin-mediated factor inhibition reduces fibrin formation; Xa / IIa profiles differ.|藉抗凝血酶抑制凝血因子以減少纖維蛋白，Xa／IIa 比例不同。", "dim": ["fibrin"], "kind": "inhibit", "tip": null}], "h": 640}], "drugs": [{"group": "Organic nitrates", "name": "Nitroglycerin", "moa": "Bioactivation → NO / cGMP; venodilation predominates|活化後經 NO／cGMP，偏靜脈擴張", "use": "Acute angina relief (sublingual); other routes for prevention / hospital use|舌下急性緩解；其他劑型用於預防或住院情境", "ae": "Headache; flushing; hypotension; reflex tachycardia; tolerance|頭痛、潮紅、低血壓、反射心搏加速、耐受", "caution": "Avoid PDE5 inhibitor co-use; caution preload-dependent RV infarct; route matters. Lecture contraindications: hypotension, aortic stenosis, HOCM, raised intracranial pressure; p.20 permits glaucoma use.|不可與 PDE5 抑制劑併用；右室梗塞依賴前負荷時謹慎；區分劑型。 講義禁忌另含低血壓、主動脈瓣狹窄、肥厚性阻塞型心肌病、顱內壓升高；p.20 記青光眼可用。", "pages": "11–22", "topic": "no"}, {"group": "Organic nitrates", "name": "Isosorbide dinitrate / mononitrate", "moa": "NO / cGMP → venodilation → preload ↓|NO／cGMP 擴張靜脈、降低前負荷", "use": "Angina prophylaxis; HF contexts|心絞痛預防、部分心衰竭情境", "ae": "Headache; hypotension; tolerance|頭痛、低血壓、耐受", "caution": "Maintain prescribed nitrate-free interval; no PDE5 inhibitor combination. Lecture contraindications: hypotension, aortic stenosis, HOCM, raised intracranial pressure; p.20 permits glaucoma use.|依處方保留無硝酸酯間隔；不與 PDE5 抑制劑併用。 講義禁忌另含低血壓、主動脈瓣狹窄、肥厚性阻塞型心肌病、顱內壓升高；p.20 記青光眼可用。", "pages": "13, 16–22", "topic": "no"}, {"group": "β blockers without ISA", "name": "Metoprolol / atenolol / propranolol", "moa": "HR and contractility ↓ → oxygen demand ↓|降低心率及收縮力，減少耗氧", "use": "Stable effort angina; post-MI contexts|穩定勞動型心絞痛、梗塞後情境", "ae": "Bradycardia; AV block; bronchospasm (nonselective)|心搏過慢、AV 阻斷；非選擇性藥可致支氣管痙攣", "caution": "Avoid ISA agents for angina; not for isolated Prinzmetal vasospasm.|心絞痛避免 ISA 藥；不選於單純 Prinzmetal 痙攣。", "pages": "24–26, 38", "topic": "oxygen"}, {"group": "DHP calcium blockers", "name": "Amlodipine / nifedipine", "moa": "Vasodilation → afterload ↓ / spasm relief|血管擴張、降低後負荷並緩解痙攣", "use": "Stable / variant angina|穩定型／變異型心絞痛", "ae": "Edema; flushing; headache; reflex tachycardia|水腫、潮紅、頭痛、反射心搏加速", "caution": "Avoid immediate-release short-acting formulations in unstable angina / AMI.|不穩定心絞痛／急性梗塞避免速放短效製劑。", "pages": "28–32, 38", "topic": "oxygen"}, {"group": "Non-DHP calcium blockers", "name": "Verapamil / diltiazem", "moa": "Cardiac L-type blockade plus vasodilation|心臟 L 型鈣阻斷兼血管擴張", "use": "Angina including vasospastic contexts|心絞痛，含血管痙攣情境", "ae": "Bradycardia; AV block; HF worsening; constipation|心搏過慢、AV 阻斷、心衰竭惡化、便祕", "caution": "Additive cardiac depression with β blockers; verapamil increases digoxin exposure.|與 β 阻斷劑加成抑制；Verapamil 增加 Digoxin 暴露。", "pages": "28–32, 38", "topic": "oxygen"}, {"group": "Late INa inhibitors", "name": "Ranolazine", "moa": "Late INa ↓ → calcium overload / diastolic tension ↓|晚期鈉電流下降、減少鈣負荷與舒張壁張力", "use": "Persistent chronic angina|持續慢性心絞痛", "ae": "Dizziness; nausea; constipation; QT prolongation|暈眩、噁心、便祕、QT 延長", "caution": "Avoid cirrhosis and strong CYP3A inhibitors / inducers; source dosing discrepancy recorded separately.|肝硬化、強 CYP3A 抑制／誘導劑避免；講義劑量差異另記。", "pages": "35, 38", "topic": "late-na"}, {"group": "If inhibitors", "name": "Ivabradine", "moa": "SA-node If blockade → HR ↓|竇房結 If 阻斷、降低心率", "use": "Selected sinus-rhythm angina when β blockade is insufficient / not tolerated|特定竇性心律且 β 阻斷不足／不耐受的心絞痛", "ae": "Bradycardia; luminous phenomena|心搏過慢、光幻視", "caution": "Sinus rhythm required; strong CYP3A4 inhibitor interaction.|需竇性心律；注意強 CYP3A4 抑制劑。", "pages": "36; 抗心律不整 46–47", "topic": "late-na"}, {"group": "Additional mechanisms", "name": "Trimetazidine / nicorandil", "moa": "Fatty-acid oxidation modulation / KATP opening respectively|分別調節脂肪酸氧化／開啟 KATP", "use": "Additional antianginal examples on lecture list|講義列出的其他抗心絞痛例子", "ae": "Not individually detailed in this lecture|本講未逐藥詳列", "caution": "List includes investigational / historical agents; not a universal treatment recommendation.|列單含研究與歷史藥物，不等於一律建議使用。", "pages": "36", "topic": null}, {"group": "Antiplatelets", "name": "Aspirin / clopidogrel / ticagrelor / abciximab", "moa": "COX / P2Y₁₂ / GP IIb/IIIa are distinct targets|COX／P2Y₁₂／GP IIb/IIIa 為不同靶點", "use": "ACS / thrombotic prevention contexts|ACS／血栓預防情境", "ae": "Bleeding|出血", "caution": "Do not infer identical indications for every platelet drug; source list is context-dependent.|不可將各藥適應症視為相同，需依來源情境。", "pages": "7–8, 40", "topic": "thrombosis"}, {"group": "Anticoagulants", "name": "Heparin / enoxaparin", "moa": "Antithrombin-mediated factor inhibition|透過抗凝血酶抑制凝血因子", "use": "ACS antithrombotic context|ACS 抗血栓情境", "ae": "Bleeding; heparin-related thrombocytopenia|出血、肝素相關血小板低下", "caution": "Different Xa / IIa profiles; not a platelet receptor blocker.|Xa／IIa 作用比例不同，並非血小板受體阻斷。", "pages": "40", "topic": "coagulation"}, {"group": "Plaque risk modification", "name": "Statins", "moa": "Cholesterol / plaque-risk modification|降低膽固醇、調整斑塊風險", "use": "Coronary risk prevention context|冠狀動脈風險預防情境", "ae": "Individual drug toxicity not detailed here|本講未詳列個別藥毒性", "caution": "Not an acute vasodilator.|非急性血管擴張劑。", "pages": "7–8", "topic": null}, {"group": "PAD agents", "name": "Pentoxifylline / cilostazol", "moa": "Reduced blood viscosity / PDE3 inhibition respectively|分別降低血黏度／抑制 PDE3", "use": "PAD / intermittent claudication|周邊動脈病／間歇性跛行", "ae": "Not detailed on source page|來源頁未詳列", "caution": "Separate PAD indication from angina; cilostazol HF warning needs clinical context.|區分 PAD 與心絞痛；Cilostazol 心衰竭禁忌需留意。", "pages": "41", "topic": null}], "supplements": [{"id": "comorbidity", "title": "Angina with comorbid disease|心絞痛合併疾病", "note": "11/03 p.37: dark boxes = commonly used; white boxes = less effective, not forbidden. Choice depends on individual response.|依 11/03 p.37：深色框為常用、白框為較無效而非禁用；選藥仍依個別反應。", "headers": ["Condition", "Commonly used (dark)", "Less effective (white)"], "rows": [["None|無合併疾病", "Long-acting nitrates; β blockers; CCBs|長效硝酸酯、β 阻斷劑、CCB", "—|未列"], ["Recent MI|近期心肌梗塞", "Long-acting nitrates; β blockers|長效硝酸酯、β 阻斷劑", "—|未列"], ["Asthma / COPD|氣喘／COPD", "Long-acting nitrates; CCBs|長效硝酸酯、CCB", "—|未列"], ["Hypertension|高血壓", "β blockers; CCBs|β 阻斷劑、CCB", "Long-acting nitrates|長效硝酸酯"], ["Diabetes|糖尿病", "Long-acting nitrates; CCBs|長效硝酸酯、CCB", "—|未列"], ["Chronic renal disease|慢性腎病", "Long-acting nitrates; CCBs|長效硝酸酯、CCB", "β blockers|β 阻斷劑"]]}]};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let zh=false,mode='table';const params=new URLSearchParams(location.search);document.body.classList.toggle('embed',params.get('embed')==='1');
function label(s){const [en,cn]=String(s).split('|');return esc(en)+(zh&&cn?'<span class="cnline">'+esc(cn)+'</span>':'')}
function mechanismLink(d){return d.topic?`<a href="${U.id}-mechanisms.html#${d.topic}">↗ Mechanism</a>`:''}
function render(){
 const search=document.querySelector('input');search.hidden=!['table','cards'].includes(mode);const query=search.value.toLowerCase();const ds=U.drugs.filter(d=>Object.values(d).join(' ').toLowerCase().includes(query));let prev='',out='';
 const supp=(U.supplements||[]).find(v=>v.id===mode);
 if(supp){out='<article><h2>'+label(supp.title)+'</h2><p>'+label(supp.note)+'</p><div class="scroll"><table class="supp-table"><thead><tr>'+supp.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+supp.rows.map(row=>'<tr>'+row.map(c=>'<td>'+label(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></article>'}
 else if(!ds.length){out='<p role="status">'+label('No matches|沒有符合的項目')+'</p>'}
 else if(mode==='table'){out='<div class="scroll"><table><thead><tr>'+['Drug / class','Mechanism','Main uses','Adverse effects','Distinctions / cautions'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+ds.map(d=>{const group=d.group!==prev;prev=d.group;return `<tr class="${group?'group':''}"><td>${esc(d.name)}<span class="cnline">${esc(d.group)}</span>${mechanismLink(d)}</td>`+['moa','use','ae','caution'].map(k=>'<td>'+label(d[k])+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>'}
 else{out=ds.map(d=>`<article><h2>${esc(d.name)}</h2><span class="cnline">${esc(d.group)}</span><dl>`+['moa','use','ae','caution'].map((k,i)=>'<dt>'+['Mechanism','Main uses','Adverse effects','Distinctions'][i]+'</dt><dd>'+label(d[k])+'</dd>').join('')+`</dl>${mechanismLink(d)}</article>`).join('')}
 document.querySelector('#results').innerHTML=out;document.querySelector('#zh').textContent=zh?'Hide 中文':'Show 中文';document.querySelector('#zh').setAttribute('aria-pressed',String(zh));document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===mode));
}
const tabs=document.querySelector('[data-mode]').parentElement;for(const t of U.supplements||[]){const b=document.createElement('button');b.dataset.mode=t.id;b.setAttribute('role','tab');b.textContent=t.title.split('|')[0];tabs.append(b)}
document.querySelector('#zh').onclick=()=>{zh=!zh;render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});document.querySelector('input').oninput=render;render();

</script></body></html>
